<script>'use strict';
/* =====================================================================================
   KRONIKI KRÓLESTW — turowa strategia fantasy w klimacie klasycznych gier o bohaterach.
   Jeden plik HTML, czysty JavaScript i Canvas 2D, bez bibliotek.

   SPIS TREŚCI (działy w kolejności w pliku; szukaj po "// ==================== NAZWA")
     KONFIGURACJA I DANE PODSTAWOWE  stałe, surowce, trudność, mapy, kolory, bonusy, ROADMAP
     DANE: TEREN I RUCH              TERRAINS/ROADS (koszty ruchu i palety kolorów)
     DANE: STWORZENIA                CREATURES: statystyki i wygląd (look) jednostek
     DANE: FRAKCJE, BOHATEROWIE...   HERO_CLASSES, FACTIONS, BUILDINGS, MINES
     DANE: ARTEFAKTY I ROZWÓJ...     PRIMARY, CLASS_GROWTH, poziomy, EQUIP_SLOTS, ARTIFACTS
     DANE: CZARY                     SPELLS, efekty i opisy; GUILD_OFFER, CLASS_SPELLS
     DANE: OBIEKTY MAPY              SITES: kapliczki, studnie, młyny, obozy… (działanie w ZASADY GRY)
     STAN GRY I USTAWIENIA           G (program), skróty do G.state: human, hero, ownerColor...
     NARZĘDZIA                       losowość, szum, A*, kolory
     RYSOWANIE: PODSTAWY I PIXEL ART tekst, cache warstw, sprite(), drawSprite(), blit()
     DŹWIĘK                          Web Audio bez plików: Sound.play(efekt), Sound.music(motyw), SFX, MUSIC
     INTERFEJS                       kamień, pergamin, Button, showDialog, drawCost, pasek surowców
     GRAFIKA OBIEKTÓW                jeden rysunek na obiekt: surowce, kopalnie, stwory, bohater, miasto
     GRAFIKA: PORTRETY BOHATERÓW     pixel art 36×36, wygląd z HERO_LOOKS albo losowany z imienia
     GRAFIKA: OBLĘŻENIE              mur, brama i wieże na polu bitwy (castleSprite), bruk dziedzińca
     GRAFIKA: STWORY TWIERDZY I INFERNA  ciała 'insect', 'lizard', 'bull', 'hydra'
     ŚWIAT: TWORZENIE NOWEJ GRY      generateMap, placeObjects, createTown, createHero, createNewGame
     ZASADY GRY                      ruch, ścieżki, obiekty, potyczki, armie, rekrutacja, dochód, budowa
     BITWA: ZASADY                   pole heksów, obrażenia, kolejka, SI, simulateBattle, resolveBattle
     ZAPIS I ODCZYT GRY              serializeGame/deserializeGame, SaveStore (konto Claude albo przeglądarka)
     MAPA PRZYGODY: RENDEROWANIE     teren piksel po pikselu, minimapa, mgła, kamera
     MIASTO: GRAFIKA                 style frakcji, budowle, sceny w perspektywie, efekty
     MIASTO: TWIERDZA I INFERNO      style, budowle i sceny dwóch nowych frakcji
     EKRANY / MAPA / BOHATER / BITWA / MIASTO  menu, listy, mapa, ekran bohatera, bitwa, widok miasta
     SILNIK                          pętla, wejście (mysz, dotyk, klawiatura, kółko), przejścia

   ZASADY, KTÓRYCH SIĘ TRZYMAMY
   • Jedno źródło prawdy. Dane frakcji tylko w FACTIONS, kolory terenu tylko w TERRAINS/ROADS,
     obietnice typu „w kroku 7” tylko w ROADMAP, dochód tylko w dailyIncomeAll().
   • G.state to dane rozgrywki bez grafiki; cały świat tworzy createNewGame(), ekrany tylko go pokazują.
     Nowe pole w stanie = sprawdź serializeGame(): dane zapisują się same, jeśli są zwykłym JSON-em.
     Zapis jest możliwy tylko, gdy nikt się nie rusza (canSaveNow), bo h.pending to funkcja.
     Zmiana formatu zapisu = podbij SAVE_VERSION (stare zapisy zostaną wtedy odrzucone z komunikatem).
   • Obiekt gry ma JEDEN rysunek wektorowy w GRAFICE OBIEKTÓW. Mapa i interfejs pokazują ten sam
     sprite: mapa przez blit(), interfejs przez drawSprite(ctx, sprite, x, y, k)
     (k = 1 to rozmiar jak na mapie). Nie rysuj obiektów w interfejsie funkcjami wektorowymi wprost.
   • Właściciel zamiast „gracza 0”: kolory przez ownerColor(st, owner), gracz-człowiek to ME.

   • Testy: npm test (katalog tests/, Chromium bez okna przez Playwright). Po zmianie zasad gry dopisz test;
     createNewGame(S, seed) ze stałym seedem daje zawsze ten sam świat.

   WSPÓŁRZĘDNE I JEDNOSTKI
   • Ekran logiczny W×H = 800×600; płótno skaluje się do okna (G.rs).
   • Pole mapy T = 32 px logiczne; świat rysujemy w buforze o połowie rozdzielczości,
     więc 1 piksel grafiki = 2 px logiczne (AP = 16 pikseli grafiki na pole).
   • Obiekt 3×2 (miasto) i 2×2 (kopalnia) stoi na polu wejścia (x, y); pozostałe pola to ob.blocks.

   JAK DODAĆ…
   • Stworzenie: wpis w CREATURES z look.kind ('hum', 'wolf', 'griffin', 'rider', 'centaur',
     'unicorn', 'phoenix', 'ghost', 'dragon'); nowy rodzaj ciała = nowy case w drawCreature().
   • Frakcję: wpis w FACTIONS, TOWN_ART, BUILD_ART (rysunki budowli) i TOWN_LAYOUTS (scena miasta).
   • Budowlę wspólną: wpis w BUILDINGS (slot = miejsce w scenie) i funkcja w BUILD_ART każdej frakcji.
   • Ekran: G.screens.nazwa = { enter(p), draw(ctx), update(dt), onClick(x, y), onBack(),
     onKey(k), onWheel(d), onPointerDown/Move/Up, rightInfo(x, y) → tekst dymka, buttons: [] };
     przejście przez G.go('nazwa', parametry).

   HISTORIA
   Kroki 1–6: menu i nowa gra, generator mapy, bohater i mgła wojny, obiekty na mapie,
   panel boczny, miasta trzech frakcji. Po kroku 6: porządki (usunięty nieużywany renderer
   wektorowy i stare wersje scen miast), kod ułożony według działów, spójna grafika mapy
   i interfejsu. Dalej: rekrutacja (7), ekran bohatera i artefakty (8), bitwy (9–10),
   czary (11), zdobywanie miast (13). Zapis i odczyt gry zrobiony wcześniej, zaraz po porządkach.
   Krok 7: rekrutacja (pule siedlisk, przyrost tygodniowy), armie bohatera i garnizonu, wymiana oddziałów,
   Krok 8: ekran bohatera, poziomy i cechy (atak, obrona, moc, wiedza), 20 artefaktów na mapie i w ekwipunku.
   Krok 9: bitwy taktyczne na heksach (ruch, walka wręcz, strzelanie, kontratak, czekanie, obrona, SI,
   walka automatyczna, ucieczka, porażka). Krok 10: zdolności jednostek (ABILITIES), przeszkody na polu bitwy,
   SI licząca opłacalność wymiany (tradeValue).
   Krok 11: czary (SPELLS): mana z wiedzy, gildie magów, księga czarów, czary w bitwie i na mapie.
   Grafika: postacie z cieniowaniem i pozami (drawHumanoid/horse/griffin/drawDragon…), w bitwie w podwójnej
   rozdzielczości z animacją (battleSprite), efekty bitwy BattleFX (cząsteczki, pociski, pioruny, poświaty).
   Krok 12: testy automatyczne (tests/), bitwa z dowolną armią: potwór, bohater albo miasto (garnizon + bohater
   w mieście), czary bohatera obrońców, pokonany bohater znika, zwycięstwo nad miastem zmienia właściciela;
   surowce, budowa i rekrutacja liczone dla właściciela (playerOf), nie tylko dla gracza-człowieka.
   Krok 13: miasta niezależne w pozostałych miejscach startowych (createNeutralTown: losowa frakcja, garnizon
   rośnie z odległością i trudnością), zdobywanie miast (startTownAssault; puste zajmuje się bez walki),
   mury Fortu/Cytadeli/Zamku dają obrońcom premię do obrony (TOWN_WALL_DEF; od etapu 2 krok 9 tylko szacunek siły SI,
   w bitwie mury stoją na polu: oblężenie z bramą, wieżami i katapultą, setupSiege).
   Krok 14: tawerna (tavernOffer/hireHero: dwóch chętnych na tydzień, HERO_COST, najwyżej MAX_HEROES),
   wielu bohaterów: blokują sobie drogę, kliknięcie własnego wybiera go, wejście na wrogiego = bitwa,
   ruch wszystkich bohaterów w pętli ekranu mapy, przewijana lista w panelu (panelItems, listScroll).
   Krok 15: przeciwnicy komputerowi (GRACZE KOMPUTEROWI: aiTurn po turze człowieka; budowa według AI_BUILD_ORDER,
   dokupowanie surowców na rynku, werbunek, najem, cele z mapy odległości aiReach, próbna walka aiWorthFight,
   rozejm AI_PEACE_DAYS zależny od trudności), koniec gry (gameResult: wygrana po pokonaniu rywali, porażka bez
   miast i bohaterów albo po NO_TOWN_DAYS dniach bez miasta), najlepsze wyniki (recordScore), wybór liczby rywali.
   Po kroku 15 (etap 1): rynek dla gracza (marketLot/trade, okno showMarket; kurs zależy od liczby rynków,
   te same zasady dla SI w buyMissing). Menu w stylu pikselowym.
   Tura przeciwnika na żywo: aiAllTurns to generator akcji (kroki, obrona), ekran mapy odtwarza go w updateAi
   (widoczne ruchy z animacją), atak na gracza pyta o walkę (askDefense) i otwiera bitwę z graczem po prawej
   (ekran bitwy: this.me, onDone). doEndTurn() bez opcji (testy) liczy wszystko od razu, z obroną automatyczną.
   Spotkanie bohaterów (showMeeting). Mgła wojny dla SI: reveal(…, owner) odkrywa teren każdemu graczowi,
   aiReach i aiPickTarget widzą tylko odkryte pola, a bez lepszego celu bohater SI idzie na zwiad (cel explore).
   Podział pliku: źródła w src/ (szablon.html + src/js/NN-dział.js, jeden plik na dział), build.js skleja je
   w „Kroniki Królestw.html” (npm run build / watch), a npm test najpierw sprawdza, czy plik jest aktualny.
   Okno dopasowane do ekranu: logiczne okno VW×VH (co najmniej W×H, do VW_MAX×VH_MAX) zamiast stałego 4:3.
   Mapa przygody (fill: true) wypełnia całe okno (layoutAdventure), menu maluje scenę na całą szerokość,
   pozostałe ekrany i okna dialogowe są wyśrodkowane (OX, OY) na tle drawBackdrop / screen.backdrop.
   Krok 6: morale i szczęście (armyMorale, heroLuck; B.morale / B.luck liczone w createBattle). Morale dodatnie
   daje drugi ruch po ataku (nextActive), ujemne wahanie i utratę tury; szczęście podwaja, pech połowi obrażenia (strike).
   Krok 7: umiejętności drugorzędne (SKILLS, h.skills = [{ id, lv }], najwyżej 8, poziomy 1–3). Awans daje wybór
   z dwóch (skillOffer: ulepszenie + nowa), SI wybiera wg AI_SKILL_ORDER. Działanie: skillVal() w ruchu, widzeniu,
   manie, dochodzie, koszcie terenu (baseCost z bohaterem), obrażeniach (damageRoll, spellDamage), morale,
   szczęściu, doświadczeniu i nekromancji (raiseDead po zwycięstwie).
   Grafika po krokach 8–12: portrety bohaterów w pixel arcie (drawHeroPortrait, własny wygląd każdego bohatera
   w HERO_LOOKS), mury oblężenia jako jeden sprite (castleSprite: kurtyna z blankami, brama między basztami,
   okrągłe wieże z gankiem; wyłom to dziura z gruzem), bruk dziedzińca w tle bitwy.
   Etap 2, krok 10: czary 4. i 5. poziomu (deszcz meteorów, modlitwa, wskrzeszenie, implozja, armagedon,
   przyspieszenie armii), gildie IV i V (GUILD_MAX), cele 'livingAlly', 'all' i 'allies' (spellArea z B),
   księga czarów w trzech kolumnach, gdy czarów jest wiele.
   Grafika mapy: ruda jako ciemne bryłki, góry/drzewa/skały ze ściankami (8 wariantów gór), ozdoby na pustych polach.
   Dźwięk: efekty i muzyka syntezowane w Web Audio (DŹWIĘK), motyw zależny od ekranu i frakcji, głośność w menu.
   Nowe frakcje: Twierdza (bagna: gnolle, jaszczuroludzie, ważki, bazyliszki, gorgony, wywerny, hydry) i Inferno (lawa:
   chochliki, gogi, ogary, demony, czarty, ifryty, diabły); klasy beastmaster/witch i demoniac/heretic, portrety, miasta, muzyka.

   PLAN (kolejność ustalona z graczem; krok 13 „warunki zwycięstwa” pominięty)
   1. Dźwięk (zrobione). 2. Nowe frakcje (zrobione: Twierdza i Inferno). 3. Statki (stocznia, woda, wyspy). 4. Hot-seat (2–4 ludzi, zasłona między turami).
   5. Samouczek (wyłączalne podpowiedzi). 6. Porządki: migracja starych zapisów, testy balansu frakcji.
   7. Grafika: animowana woda, wyraźniejsze sosny i ozdoby, obiekty mapy w stylu rudy, tła bitew zależne od terenu.
   ===================================================================================== */

function artBonusText(b) {
  const out = [];
  for (const p of PRIMARY) if (b[p.id]) out.push(`+${b[p.id]} do ${p.gen}`);
  if (b.morale) out.push(`${signed(b.morale)} do morale`); if (b.luck) out.push(`${signed(b.luck)} do szczęścia`);

  return out.join(', ');
}

// Układa 8 taktów po 8 ósemek: akord (pad), bas, arpeggio, melodia z prostym motywem (A A' powtórzone) i bębny w bitwie
function composeSong(T) {
  const r = mulberry32(T.seed), steps = Array.from({ length: 64 }, () => []), S = T.scale;
  const deg = (d, oct = 0) => T.root + S[((d % 7) + 7) % 7] + 12 * (oct + Math.floor(d / 7));
  const rhythms = [[2, 2, 2, 2], [3, 1, 2, 2], [2, 1, 1, 4], [4, 2, 2], [1, 1, 2, 2, 2], [6, 2]];
  const motif = [0, 1].map(() => rhythms[Math.floor(r() * rhythms.length)]);
  let mel = 4; // stopień skali melodii względem toniki (oktawa wyżej)
  T.prog.forEach((c, bar) => {
    const b = bar * 8, chord = [c, c + 2, c + 4];
    chord.forEach(d => steps[b].push({ i: 'pad', m: deg(d), len: 8 }));
    steps[b].push({ i: 'bass', m: deg(c, -1), len: 3 }); steps[b + 4].push({ i: 'bass', m: deg(c + (T.drums ? 0 : 4), -1), len: 3 });

      if (bar === 7 && j === rh.length - 1) mel = 7; // koniec frazy na tonice
      if (!(bar % 4 === 3 && j === 0 && r() < 0.3)) steps[b + k].push({ i: T.lead, m: deg(mel, 0), len });

// --- artefakty: jeden rysunek (24×24 jednostki wokół 0,0) dla mapy, okien i ekranu bohatera ---
function drawArtifact(c, id) {
  const A = ARTIFACTS[id], col = A.col, gem = A.gem, dk = shadeHex(col, -0.4), lt = shadeHex(col, 0.35);
  const poly = (pts, f) => { c.fillStyle = f; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill(); };
  c.lineCap = 'round'; c.lineJoin = 'round';
  switch (A.icon) {
    case 'sword':
      poly([[-9, 9], [5, -5], [8, -8], [7, -4], [-7, 10]], col); c.strokeStyle = lt; c.lineWidth = 1; c.beginPath(); c.moveTo(-7, 8); c.lineTo(6, -6); c.stroke();
      c.strokeStyle = '#6a4424'; c.lineWidth = 2.6; c.beginPath(); c.moveTo(-8, 3); c.lineTo(-3, 8); c.stroke();
      c.strokeStyle = '#3a2410'; c.beginPath(); c.moveTo(-6, 6); c.lineTo(-10, 10); c.stroke(); circ(c, -10.5, 10.5, 1.8, gem); break;
    case 'axe':
      c.strokeStyle = '#6a4424'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(-8, 10); c.lineTo(5, -7); c.stroke();
      poly([[1, -9], [9, -11], [11, -3], [6, 2], [3, -3]], col); poly([[3, -8], [8, -9], [9, -4]], lt); break;
    case 'shield':
      poly([[-9, -9], [9, -9], [9, 0], [0, 11], [-9, 0]], col); poly([[-9, -9], [0, -9], [0, 11], [-9, 0]], shadeHex(col, -0.15));
      c.strokeStyle = gem; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -7); c.lineTo(0, 7); c.moveTo(-6, -2); c.lineTo(6, -2); c.stroke(); break;
    case 'helm':
      c.fillStyle = col; c.beginPath(); c.arc(0, 1, 9, Math.PI, 0); c.lineTo(9, 8); c.lineTo(-9, 8); c.closePath(); c.fill();
      c.fillStyle = '#1a1a22'; c.fillRect(-7, 1, 14, 3); c.fillStyle = gem; c.fillRect(-1, -8, 2, 16); c.fillStyle = lt; c.fillRect(-6, -4, 3, 3); break;
    case 'crown':
      poly([[-10, 7], [-10, -5], [-5, 0], [0, -9], [5, 0], [10, -5], [10, 7]], col); c.fillStyle = dk; c.fillRect(-10, 4, 20, 3);
      circ(c, 0, -2, 2, gem); circ(c, -6, 3, 1.5, gem); circ(c, 6, 3, 1.5, gem); break;
    case 'amulet':
      c.strokeStyle = col; c.lineWidth = 1.5; c.beginPath(); c.arc(0, -4, 8, Math.PI * 0.1, Math.PI * 0.9, true); c.stroke();
      poly([[0, 1], [6, 6], [0, 12], [-6, 6]], col); poly([[0, 3], [4, 6], [0, 10], [-4, 6]], gem); break;
    case 'ring':
      c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); c.ellipse(0, 3, 7, 6, 0, 0, TAU); c.stroke();
      poly([[0, -9], [4, -5], [0, -1], [-4, -5]], gem); c.strokeStyle = lt; c.lineWidth = 1; c.beginPath(); c.arc(0, 3, 7, Math.PI * 1.1, Math.PI * 1.4); c.stroke(); break;
    case 'cloak':
      poly([[-5, -9], [5, -9], [10, 10], [-10, 10]], col); poly([[-5, -9], [0, -9], [-3, 10], [-10, 10]], shadeHex(col, -0.2));
      c.fillStyle = gem; c.fillRect(-6, -10, 12, 3); circ(c, 0, -8.5, 1.8, '#f0c040'); break;
    case 'armor':
      poly([[-10, -7], [-4, -9], [4, -9], [10, -7], [8, 1], [7, 10], [-7, 10], [-8, 1]], col);
      c.strokeStyle = dk; c.lineWidth = 1; for (let yy = -5; yy <= 8; yy += 3) { c.beginPath(); c.moveTo(-7, yy); c.lineTo(7, yy); c.stroke(); }
      poly([[-3, -9], [3, -9], [0, -5]], gem); break;
    case 'boots':
      poly([[-8, -9], [-1, -9], [-1, 4], [9, 5], [9, 10], [-8, 10]], col); c.fillStyle = dk; c.fillRect(-8, 8, 17, 2.5); c.fillStyle = gem; c.fillRect(-8, -9, 7, 2.5); break;
    case 'bag':
      c.fillStyle = col; c.beginPath(); c.ellipse(0, 4, 9, 7, 0, 0, TAU); c.fill(); poly([[-4, -3], [4, -3], [6, -9], [-6, -9]], col);
      c.fillStyle = dk; c.fillRect(-5, -4, 10, 2); circ(c, 3, 5, 3, gem); circ(c, 3, 5, 1.2, shadeHex(gem, -0.3)); break;
    case 'horseshoe':
      c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.arc(0, -1, 7, Math.PI * 0.05, Math.PI * 0.95, true); c.stroke();
      c.fillStyle = gem; for (const [x, y] of [[-6, -4], [-3, -7.5], [3, -7.5], [6, -4]]) c.fillRect(x - 0.8, y - 0.8, 1.6, 1.6); break;
    case 'orb':

      c.strokeStyle = gem; c.lineWidth = 1.5; c.beginPath(); c.moveTo(1, -6); c.lineTo(1, 5); c.moveTo(-2, -3); c.lineTo(4, 2); c.moveTo(4, -3); c.lineTo(-2, 2); c.stroke(); break;

// --- czary: ikony i księga czarów (mapa, bitwa, ekran bohatera) ---
function drawSpellIcon(c, id) {
  const S = SPELLS[id], col = S.col, dk = shadeHex(col, -0.45);
  c.fillStyle = dk; c.beginPath(); c.arc(0, 0, 11, 0, TAU); c.fill(); c.fillStyle = col; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round';
  const poly = pts => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill(); };
  switch (id) {
    case 'magicArrow': c.lineWidth = 2; c.beginPath(); c.moveTo(-6, 6); c.lineTo(5, -5); c.stroke(); poly([[7, -7], [1, -5], [5, -1]]); break;
    case 'bless': for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; c.lineWidth = 1.6; c.beginPath(); c.moveTo(Math.cos(a) * 4, Math.sin(a) * 4); c.lineTo(Math.cos(a) * 8, Math.sin(a) * 8); c.stroke(); } c.beginPath(); c.arc(0, 0, 3.5, 0, TAU); c.fill(); break;
    case 'stoneSkin': poly([[-7, -6], [7, -6], [7, 1], [0, 8], [-7, 1]]); c.fillStyle = dk; c.fillRect(-3, -3, 2, 2); c.fillRect(2, 0, 2, 2); break;
    case 'haste': poly([[-7, 2], [2, -7], [0, -1], [7, -2], [-2, 7], [0, 1]]); break;
    case 'cure': c.fillRect(-2, -7, 4, 14); c.fillRect(-7, -2, 14, 4); break;
    case 'slow': c.lineWidth = 2; c.beginPath(); c.arc(0, 0, 6.5, 0, TAU); c.stroke(); c.beginPath(); c.moveTo(0, -4); c.lineTo(0, 0); c.lineTo(3, 2); c.stroke(); break;
    case 'eagleEye': c.beginPath(); c.ellipse(0, 0, 8, 4.5, 0, 0, TAU); c.fill(); c.fillStyle = dk; c.beginPath(); c.arc(0, 0, 2.5, 0, TAU); c.fill(); break;
    case 'lightningBolt': poly([[2, -8], [-5, 1], [0, 1], [-2, 8], [5, -1], [0, -1]]); break;
    case 'weakness': c.lineWidth = 2; c.beginPath(); c.moveTo(-6, 6); c.lineTo(-1, 1); c.moveTo(1, -1); c.lineTo(6, -6); c.stroke(); break;
    case 'bloodlust': c.beginPath(); c.moveTo(0, -8); c.quadraticCurveTo(7, 1, 0, 7); c.quadraticCurveTo(-7, 1, 0, -8); c.fill(); break;
    case 'fireball': c.beginPath(); c.arc(0, 2, 5.5, 0, TAU); c.fill(); poly([[-5, 0], [-3, -8], [0, -3], [3, -8], [5, 0]]); break;
    case 'animateDead': c.beginPath(); c.arc(0, -1, 6, 0, TAU); c.fill(); c.fillRect(-4, 3, 8, 4); c.fillStyle = dk; c.fillRect(-3.5, -3, 2.5, 2.5); c.fillRect(1, -3, 2.5, 2.5); break;
    case 'townPortal': c.lineWidth = 2.2; c.beginPath(); c.ellipse(0, 0, 5, 8, 0, 0, TAU); c.stroke(); c.beginPath(); c.arc(0, 0, 2, 0, TAU); c.fill(); break;
    case 'meteorShower': for (const [x, y, r] of [[-3, -3, 3], [4, 1, 2.5], [-1, 5, 2]]) { c.lineWidth = 1.5; c.beginPath(); c.moveTo(x - 4, y - 4); c.lineTo(x, y); c.stroke(); c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); } break;
    case 'prayer': c.fillRect(-1.5, -8, 3, 16); c.fillRect(-6, -4, 12, 3); c.lineWidth = 1.2; c.beginPath(); c.arc(0, -2.5, 7, 0, TAU); c.stroke(); break;
    case 'resurrection': c.beginPath(); c.moveTo(0, -8); c.lineTo(-6, -1); c.lineTo(-2, -1); c.lineTo(-2, 7); c.lineTo(2, 7); c.lineTo(2, -1); c.lineTo(6, -1); c.closePath(); c.fill(); break;
    case 'implosion': c.lineWidth = 1.6; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; c.beginPath(); c.moveTo(Math.cos(a) * 8, Math.sin(a) * 8); c.lineTo(Math.cos(a) * 3.5, Math.sin(a) * 3.5); c.stroke(); } c.fillStyle = dk; c.beginPath(); c.arc(0, 0, 2.5, 0, TAU); c.fill(); break;
    case 'armageddon': poly([[-8, 7], [-6, -1], [-3, 3], [0, -8], [3, 3], [6, -1], [8, 7]]); c.fillStyle = '#ffd060'; poly([[-4, 7], [0, -1], [4, 7]]); break;
    case 'massHaste': for (const dx of [-4, 4]) poly([[dx - 4, 2], [dx + 1, -7], [dx, -1], [dx + 4, -2], [dx - 1, 7], [dx, 1]]); break;

}

  const cell = i => ({ x: x + 24 + (i % cols) * cw, y: y + 76 + Math.floor(i / cols) * rh, w: cw - 10, h: rh - 4 });

    rightInfo(px, py) { const i = list.findIndex((id, k) => inRect(px, py, cell(k))); if (i < 0) return null; const S = SPELLS[list[i]]; return `${S.name} (poziom ${S.level}, ${S.kind === 'battle' ? 'w bitwie' : 'na mapie'}, koszt ${S.cost} many): ${S.desc(sp)}.`; },

      list.forEach((id, i) => {

      close.draw(ctx);
    },

}

// Wartość surowca w złocie; kupno drożeje, a sprzedaż tanieje, im mniej rynków ma gracz (jak w oryginale).
const RES_VALUE = { wood: 250, ore: 250, mercury: 500, sulfur: 500, crystal: 500, gems: 500, gold: 1 };

// Najmniejsza transakcja: oddajesz give sztuk `from`, dostajesz get sztuk `to` (null bez rynku albo dla tej samej rzeczy)

function showBattleResult(st, h, res) {
  const lost = res.lost.length ? `Straty: ${res.lost.join(', ')}.` : 'Bez strat.';
  Sound.play(res.outcome === 'win' ? 'victory' : 'defeat');
  if (res.outcome === 'win') {
    const extra = (res.heroDefeated ? ` ${res.heroDefeated.name} zostaje ${res.heroDefeated.female ? 'pokonana' : 'pokonany'} i znika z mapy.` : '') + (res.captured ? ` Miasto ${res.captured} należy teraz do ciebie.` : '');
    showDialog(`Zwycięstwo!${extra} ${lost}${raisedText(res.raised)} Doświadczenie: +${res.exp}.`, [{ label: 'OK', key: 'enter', action: () => {
      advFloat(`+${res.exp} dośw.`, h.x, h.y);
      gainExp(st, h, res.exp, () => { const here = objectAt(st, h.y * st.map.n + h.x); if (here && here.type !== 'monster') visitObject(st, h, here); });

  else { showDialog(`Porażka. Armia została rozbita, a ${h.name} ledwie uchodzi z życiem${res.home ? ` do miasta ${res.home}` : ''}. Zwerbuj nowe wojsko, zanim ruszysz dalej.`, [{ label: 'OK', key: 'enter' }]); }

      ...offer.map(id => ({ label: CREATURES[id].name, sub: `${CREATURES[id].cost.gold} złota`, tip: stackInfo({ cid: id, n: 1 }), action: () => { const e = buyMachine(st, t, h, id); this.say(e || `Kupiono: ${CREATURES[id].name.toLowerCase()}`); if (!e) this.showSmith(); } })),
      { label: 'Wyjdź', key: 'escape' },
    ], { bw, iconH: 70, icon: (ctx, cx, cy) => offer.forEach((id, i) => drawSprite(ctx, battleSprite(id, 1, 'idle', 0), cx - total / 2 + i * (bw + gap) + bw / 2, cy + 26, 1)) });
  },
  showGuild() {
    const t = this.town(), L = guildLevel(t), F = factionOf(t.faction);
    const lines = []; for (let k = 1; k <= L; k++) lines.push(`poziom ${k}: ${((t.guild || {})[k] || []).map(id => SPELLS[id].name).join(', ')}`);
    showDialog(`${F.guild}${L > 1 ? ` ${['', '', 'II', 'III', 'IV', 'V'][L]}` : ''}. Czary: ${lines.join('; ')}. Bohater, który tu wejdzie, pozna je wszystkie i odnowi manę.`, [{ label: 'OK', key: 'enter' }]);
  },
  tryBuild(B) {
    const st = G.state, t = this.town(), info = bInfo(B, t.faction);
    if (t.builtToday) return this.say('W tym mieście zbudowano już dziś budowlę');
    if (!canAfford(st, B.cost)) return this.say('Brakuje zasobów na tę budowlę');
    showDialog(`Zbudować: ${info.name}? ${info.desc}`, [
      { label: 'Zbuduj', key: 'enter', action: () => { buildIn(st, t, B); Sound.play('build'); this.say(`Zbudowano: ${info.name}`); if (/^guild/.test(B.id)) this.guildVisit(); } },
      { label: 'Nie', key: 'escape' },
    ], { iconH: 40, icon: (ctx, cx, cy) => { ctx.font = font(14, 700, 'body'); const w = RESOURCES.reduce((a, r) => a + (B.cost[r.id] ? 29 + ctx.measureText(String(B.cost[r.id])).width : 0), 0); drawCost(ctx, B.cost, cx - w / 2, cy, { size: 24 }); } });
  },
  slotAt(x, y) {
    if (x > 584 || y > 430) return null;
    const RR = (TownFXCache[lastTownKey] || {}).rects || {}; let best = null;
    for (const [i, r] of Object.entries(RR)) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h && (!best || r.z < best.z)) best = { i: +i, z: r.z };
    return best ? best.i : null;
  },
  onPointerMove(x, y) { this.hoverSlot = this.slotAt(x, y); },
  // Miejsca armii: [{ a: tablica armii, i: indeks }] garnizonu i bohatera w mieście
  armySlotAt(x, y) {
    const t = this.town(), hh = heroInTown(G.state, t), g = hitRect(this.garRects, x, y); if (g) return { a: t.garrison, i: g.i };
    const r = hh && hitRect(this.heroRects, x, y); return r ? { a: hh.army, i: r.i } : null;
  },
  onClick(x, y) {
    if (clickButtons(this.buttons, x, y)) return;
    const st = G.state, t = this.town(), fac = t.faction, row = this.rows.find(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
    const hh0 = heroInTown(st, t); if (hh0 && x >= 38 && x <= 74 && y >= 505 && y <= 541) return G.go('hero', { heroId: st.heroes.indexOf(hh0), back: { name: 'town', params: { townId: this.townId } } });
    const slot = this.armySlotAt(x, y);
    if (slot) { // zaznacz oddział, potem wskaż miejsce: przeniesienie, połączenie albo zamiana
      if (!this.sel) { if (slot.a[slot.i]) this.sel = slot; return; }
      const hh = heroInTown(st, t), err = armyMove(this.sel.a, this.sel.i, slot.a, slot.i, hh ? [hh.army] : []);
      this.sel = null; if (err) this.say(err); return;
    }
    this.sel = null;
    if (row) return this.tryBuild(row.B);
    const i = this.slotAt(x, y); if (i === null) return;
    const B = slotBuilding(t, i), next = BUILDINGS.find(b => b.slot === i && !hasB(t, b.id));
    const dw = B && /^dw(\d)u?$/.exec(B.id); if (dw) return showRecruit(st, t, +dw[1], m => this.say(m)); // siedlisko: werbunek
    if (B && /^guild/.test(B.id) && !(next && reqMet(t, next))) return this.showGuild();
    if (B && B.id === 'tavern') return this.showTavern();
    if (B && B.id === 'smith') return this.showSmith();
    if (B && B.id === 'market' && !(next && reqMet(t, next))) return showMarket(st, t.owner, m => this.say(m));
    if (next && reqMet(t, next)) this.tryBuild(next);
    else if (next) showDialog(`${bInfo(next, fac).name} wymaga wcześniej: ${next.req.map(r => bInfo(BUILD_BY_ID[r], fac).name).join(', ')}.`, [{ label: 'OK', key: 'enter' }]);
    else if (B) showDialog(`${bInfo(B, fac).name}. ${bInfo(B, fac).desc}`, [{ label: 'OK', key: 'enter' }]);
  },
  rightInfo(x, y) {
    const t = this.town(), fac = t.faction, row = this.rows.find(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
    if (row) { const inf = bInfo(row.B, fac); return `${inf.name}. ${inf.desc}`; }
    const slot = this.armySlotAt(x, y);
    if (slot) return slot.a[slot.i] ? stackInfo(slot.a[slot.i]) : 'Wolne miejsce. Kliknij oddział, a potem miejsce, aby go przenieść, połączyć z takim samym albo zamienić.';
    const i = this.slotAt(x, y); if (i === null) return resourceBarInfo(G.state, x, y);
    const B = slotBuilding(t, i); if (B) { const inf = bInfo(B, fac), dw = /^dw(\d)u?$/.exec(B.id); return `${inf.name}. ${inf.desc}` + (dw ? ` Dostępne: ${t.avail[+dw[1]] || 0}. Kliknij, aby werbować.` : B.id === 'tavern' ? ` Kliknij, aby nająć bohatera (${HERO_COST} złota).` : B.id === 'smith' ? ' Kliknij, aby kupić machiny wojenne.' : B.id === 'market' ? ' Kliknij, aby handlować.' : ''); }

    return null;
  },
  draw(ctx) {

    ctx.drawImage(Layers.get('townChrome', W, H, paintTownChrome), 0, 0, W, H);
    const key = `tw_${fac}_${[...t.built].sort().join('.')}_${col}`;
    if (lastTownKey && lastTownKey !== key) { delete Layers.cache[lastTownKey]; delete TownFXCache[lastTownKey]; }
    lastTownKey = key;
    const scene = Layers.get(key, 592, 438, c => { c.imageSmoothingEnabled = false; TownFXCache[key] = paintTownScene(c, t, col); }, TOWN_ART_SCALE);
    const fb = pixBuf('townFx', scene.width, scene.height, true), fbx = fb._ctx;
    fbx.setTransform(1, 0, 0, 1, 0, 0); fbx.imageSmoothingEnabled = false; fbx.clearRect(0, 0, fb.width, fb.height); fbx.drawImage(scene, 0, 0);
    fbx.setTransform(TOWN_ART_SCALE, 0, 0, TOWN_ART_SCALE, 0, 0); drawTownFX(fbx, t, TownFXCache[key] || { wins: [], smokes: [] }); pixelQuantize(fb);
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(fb, 0, 0, fb.width / TOWN_ART_SCALE, fb.height / TOWN_ART_SCALE); ctx.restore();
    if (this.hoverSlot !== null && !G.modal) {
      const hb = ((TownFXCache[key] || {}).rects || {})[this.hoverSlot] || { x: 0, y: 0, w: 0, h: 0 };
      const s = { x: hb.x, b: hb.y + hb.h, w: hb.w, h: hb.h }, B = slotBuilding(t, this.hoverSlot), next = BUILDINGS.find(b => b.slot === this.hoverSlot && !hasB(t, b.id));
      ctx.strokeStyle = 'rgba(255,232,154,.85)'; ctx.lineWidth = 2; rr(ctx, s.x - 2, s.b - s.h - 4, s.w + 4, s.h + 8, 5); ctx.stroke();
      const label = B ? bInfo(B, fac).name : (next ? `${bInfo(next, fac).name} (do zbudowania)` : '');
      if (label) { ctx.font = font(15, 700, 'title'); const w = ctx.measureText(label).width + 20, x = clamp(s.x + s.w / 2 - w / 2, 12, 580 - w), y = Math.max(14, s.b - s.h - 30);
        ctx.fillStyle = 'rgba(12,8,3,.82)'; rr(ctx, x, y, w, 22, 3); ctx.fill(); text(ctx, label, x + w / 2, y + 11, { size: 15, align: 'center', color: '#f3e2b0', fam: 'title' }); }
    }
    // garnizon i armia bohatera stojącego w mieście
    const hh = heroInTown(st, t), selOf = a => (this.sel && this.sel.a === a ? this.sel.i : -1);
    text(ctx, 'Garnizon', 56, 471, { size: 15, align: 'center', color: '#f0e4c0', fam: 'title' });
    this.garRects = drawArmyRow(ctx, t.garrison, 100, 446, { sel: selOf(t.garrison) });
    if (hh) { drawHeroPortrait(ctx, 38, 505, hh, ownerColor(st, hh.owner)); this.heroRects = drawArmyRow(ctx, hh.army, 100, 498, { sel: selOf(hh.army) }); }
    else { this.heroRects = []; text(ctx, 'Brak bohatera w mieście. Wejdź bohaterem, aby przekazać mu wojsko.', 335, 523, { size: 13, italic: true, weight: 500, align: 'center', color: 'rgba(240,228,192,.55)' }); }
    if (this.sel && !this.sel.a[this.sel.i]) this.sel = null;
    const rb = this.baseButtons[0]; rb.disabled = !dwellingLevels(t).length;
    rb.tip = rb.disabled ? 'Najpierw zbuduj siedlisko jednostek (np. z listy budowli po prawej).' : 'Werbunek jednostek ze wszystkich siedlisk miasta (klawisz R).';
    text(ctx, t.name, 692, 28, { size: 20, align: 'center', color: '#f3e2b0', fam: 'title' });
    text(ctx, `${factionOf(fac).name}, ${townGold(t)} złota dziennie`, 692, 50, { size: 14, weight: 500, align: 'center', color: '#d8c8a0' });
    text(ctx, t.builtToday ? 'Budowa: wykorzystana dziś' : 'Budowa: dostępna', 692, 70, { size: 14, weight: 500, align: 'center', color: t.builtToday ? '#e0a070' : '#8ad080' });
    const list = availableBuildings(t), N = this.LIST_ROWS; this.rows = [];
    this.scroll = clamp(this.scroll, 0, Math.max(0, list.length - N));
    list.slice(this.scroll, this.scroll + N).forEach((B, i) => {
      const y = 88 + i * 50, afford = canAfford(st, B.cost) && !t.builtToday, info = bInfo(B, fac);
      this.rows.push({ B, x: 596, y, w: 192, h: 46 });
      const hot = !G.modal && G.mouse.x >= 596 && G.mouse.x <= 788 && G.mouse.y >= y && G.mouse.y <= y + 46;
      ctx.fillStyle = hot ? 'rgba(210,160,60,.3)' : 'rgba(0,0,0,.3)'; rr(ctx, 596, y, 192, 46, 3); ctx.fill();
      ctx.strokeStyle = afford ? '#b8913f' : '#6a5a3a'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.font = font(14, 700, 'title'); let fs = 14; while (fs > 10 && ctx.measureText(info.name).width > 180) { fs--; ctx.font = font(fs, 700, 'title'); }
      text(ctx, info.name, 604, y + 14, { size: fs, color: afford ? '#f3e2b0' : '#a89a80', fam: 'title' });
      drawCost(ctx, B.cost, 604, y + 32, { size: 18, font: 13, color: '#e8dcb8', missing: '#e07a6a', free: '#8ad080', have: human(st).resources });
    });
    if (!list.length) text(ctx, 'Brak dostępnych budowli', 692, 120, { size: 13, italic: true, weight: 500, align: 'center', color: '#c8b68a' });
    const paged = list.length > N;
    const base = hasB(t, 'shipyard') ? [this.bRecruitHalf, this.bShip, this.baseButtons[1]] : this.baseButtons; // ze stocznią: werbunek i łódź obok siebie
    this.buttons = paged ? [...base, this.btnUp, this.btnDown] : base;
    if (paged) {
      this.btnUp.disabled = this.scroll === 0; this.btnDown.disabled = this.scroll >= list.length - N;
      text(ctx, `${this.scroll + 1}–${Math.min(list.length, this.scroll + N)} z ${list.length}`, 692, 406, { size: 13, italic: true, weight: 500, align: 'center', color: '#c8b68a' });
    }
    this.buttons.forEach(b => b.draw(ctx));
    if (this.msg && G.time - this.msgT < 2.4) { ctx.fillStyle = 'rgba(12,8,3,.8)'; rr(ctx, 160, 398, 272, 26, 4); ctx.fill(); text(ctx, this.msg, 296, 411, { size: 15, align: 'center', color: '#ffd98a', fam: 'title' }); }
    drawResourceBar(ctx, st);
  },
};
function paintTownChrome(c) {
  stoneFill(c, 0, 0, W, H);
  goldFrame(c, 8, 8, 576, 422);
  c.fillStyle = 'rgba(0,0,0,.45)'; rr(c, 12, 440, 568, 112, 4); c.fill(); c.strokeStyle = '#8a6d32'; c.lineWidth = 1.2; c.stroke();
  rr(c, 592, 12, 200, 528, 4); c.fill(); c.stroke();
  c.fillStyle = 'rgba(0,0,0,.55)'; rr(c, 8, 569, 784, 27, 3); c.fill(); c.strokeStyle = '#8a6d32'; c.lineWidth = 1; c.stroke();
}

// ==================== SILNIK: pętla, wejście, przejścia =================================
// Nie zawiera logiki gry. Ekran to obiekt z metodami enter/draw/update/onClick/... (patrz nagłówek).
function setScreen(name, params) { G.screen = G.screens[name]; G.screenName = name; G.modal = null; if (G.screen.enter) G.screen.enter(params || {}); Sound.screen(name); }
G.go = function (name, params) { if (G.fade.next) return; G.fade.next = { name, params }; G.fade.target = 1; };
function activeButtons() { return G.modal ? G.modal.buttons : (G.screen.buttons || []); }
function updateHover() {
  G.hover = G.fade.next ? null : (activeButtons().find(b => !b.disabled && b.hit(G.mouse.x, G.mouse.y)) || null);
  G.canvas.style.cursor = G.hover ? 'pointer' : 'default';
}
function handleClick(x, y) {
  if (G.fade.next) return;
  if (G.modal) { if (!clickButtons(G.modal.buttons, x, y) && G.modal.onClick) G.modal.onClick(x, y); return; }
  if (G.screen.onClick) G.screen.onClick(x, y); else clickButtons(G.screen.buttons || [], x, y);
}
function onKey(e) {
  Sound.unlock();
  const k = e.key.toLowerCase(); G.keys.add(k);
  if (G.fade.next) return;
  const b = activeButtons().find(b => !b.disabled && b.key === k);
  if (b) { e.preventDefault(); Sound.play('click'); if (b.action) b.action(); return; }
  if (k === 'escape') { if (G.modal) { if (!G.modal.locked) G.modal = null; } else if (G.screen.onBack) G.screen.onBack(); }
  else if (!G.modal && G.screen.onKey) G.screen.onKey(k, e);
}
// Współrzędne myszy: vx, vy w całym oknie (VW×VH); x, y w układzie aktywnej warstwy: okno dialogowe
// i zwykłe ekrany leżą w wyśrodkowanym obszarze W×H (przesunięcie OX, OY), ekrany fill w całym oknie.
const layerOffset = () => (G.modal || !(G.screen && G.screen.fill)) ? [OX, OY] : [0, 0];
function toLogical(e) {
  const r = G.canvas.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * VW, vy = (e.clientY - r.top) / r.height * VH, [ox, oy] = layerOffset();
  return { x: vx - ox, y: vy - oy, vx, vy };
}
function syncMouse() { const m = G.mouse; if (m.vx == null || m.vx < 0) return; const [ox, oy] = layerOffset(); m.x = m.vx - ox; m.y = m.vy - oy; }
function bindInput() {
  const c = G.canvas;
  window.addEventListener('pointermove', e => {
    const p = toLogical(e); G.mouse.x = p.x; G.mouse.y = p.y; G.mouse.vx = p.vx; G.mouse.vy = p.vy; G.mouse.type = e.pointerType;
    if (!G.modal && G.screen && G.screen.onPointerMove) G.screen.onPointerMove(p.x, p.y, e);
  });
  c.addEventListener('pointerdown', e => {
    Sound.unlock();
    if (e.button === 2) {
      e.preventDefault(); const p = toLogical(e); G.mouse.x = p.x; G.mouse.y = p.y; G.mouse.vx = p.vx; G.mouse.vy = p.vy; updateHover();
      const txt = rightInfoAt(p.x, p.y); if (txt) G.popup = { text: txt, x: p.vx, y: p.vy };
      return;
    }
    if (e.button !== 0) return; e.preventDefault(); G.popup = null;
    if (e.pointerType !== 'mouse') {
      const p0 = toLogical(e); clearTimeout(G.pressTimer);
      G.pressTimer = setTimeout(() => { const txt = rightInfoAt(p0.x, p0.y); if (txt) { G.popup = { text: txt, x: p0.vx, y: p0.vy }; G.longPress = true; } }, 420);
    }
    const p = toLogical(e); G.mouse.x = p.x; G.mouse.y = p.y; G.mouse.vx = p.vx; G.mouse.vy = p.vy; G.mouse.type = e.pointerType; G.mouse.down = true;
    updateHover(); G.downTarget = G.hover;
    if (!G.hover && !G.modal && !G.fade.next && G.screen.onPointerDown) G.screen.onPointerDown(p.x, p.y, e);
  });
  window.addEventListener('pointerup', e => {
    if (e.button === 2) { G.popup = null; return; }
    clearTimeout(G.pressTimer);
    if (!G.mouse.down) return; G.mouse.down = false; const p = toLogical(e);
    if (G.longPress) { G.longPress = false; G.downTarget = null; return; }
    const consumed = (!G.modal && G.screen.onPointerUp) ? G.screen.onPointerUp(p.x, p.y, e) : false;
    if (!consumed && p.vx >= 0 && p.vx <= VW && p.vy >= 0 && p.vy <= VH) handleClick(p.x, p.y);
    G.downTarget = null; if (e.pointerType !== 'mouse') { G.mouse.x = G.mouse.y = G.mouse.vx = G.mouse.vy = -1; }
  });
  c.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !G.mouse.down) { G.mouse.x = G.mouse.y = G.mouse.vx = G.mouse.vy = -1; } });
  c.addEventListener('contextmenu', e => e.preventDefault());
  c.addEventListener('wheel', e => { if (!G.modal && !G.fade.next && G.screen.onWheel) { e.preventDefault(); G.screen.onWheel(Math.sign(e.deltaY)); } }, { passive: false });
  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', e => G.keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => G.keys.clear());
}
// Okno gry wypełnia ekran: skala tak, by zmieścił się obszar W×H, a reszta szerokości albo wysokości
// (do VW_MAX×VH_MAX) poszerza okno logiczne. Wymiary parzyste, bo bufory pikselowe mają połowę rozdzielczości.
function resize() {
  const wrap = document.getElementById('wrap'), aw = Math.max(1, wrap.clientWidth), ah = Math.max(1, wrap.clientHeight);
  const s = Math.min(aw / W, ah / H);
  VW = clamp(Math.floor(aw / s / 2) * 2, W, VW_MAX); VH = clamp(Math.floor(ah / s / 2) * 2, H, VH_MAX);
  OX = (VW - W) / 2; OY = (VH - H) / 2;
  for (const k in Layers.cache) if (/_\d+x\d+$/.test(k)) delete Layers.cache[k]; // warstwy zależne od rozmiaru okna
  const cw = Math.max(1, Math.floor(VW * s)), ch = Math.max(1, Math.floor(VH * s));
  G.dpr = Math.min(window.devicePixelRatio || 1, 2); G.scale = cw / VW; G.rs = G.scale * G.dpr;
  G.canvas.style.width = cw + 'px'; G.canvas.style.height = ch + 'px';
  G.canvas.width = Math.round(cw * G.dpr); G.canvas.height = Math.round(ch * G.dpr);
}
function update(dt) {
  G.time += dt; const f = G.fade, sp = 3.5;
  if (f.a < f.target) f.a = Math.min(f.target, f.a + dt * sp); else if (f.a > f.target) f.a = Math.max(f.target, f.a - dt * sp);
  if (f.next && f.a >= 1) { const n = f.next; f.next = null; setScreen(n.name, n.params); f.target = 0; }
  syncMouse(); updateHover(); if (G.screen.update) G.screen.update(dt);
}
function render() {
  const ctx = G.ctx, s = G.rs, center = () => ctx.setTransform(s, 0, 0, s, OX * s, OY * s);
  ctx.setTransform(s, 0, 0, s, 0, 0); ctx.clearRect(0, 0, VW, VH);
  if (G.screen.fill) G.screen.draw(ctx);
  else { if (OX || OY) drawBackdrop(ctx); center(); G.screen.draw(ctx); }
  if (G.modal) { center(); G.modal.draw(ctx); }
  ctx.setTransform(s, 0, 0, s, 0, 0);
  if (G.popup) drawPopup(ctx, G.popup);
  if (G.fade.a > 0) { ctx.fillStyle = `rgba(0,0,0,${G.fade.a.toFixed(3)})`; ctx.fillRect(0, 0, VW, VH); }
}
// Tło wokół wyśrodkowanego ekranu: kamień jak w ramkach gry, przyciemniony, ze złotą obwódką.
// Ekran może podać własne (screen.backdrop), np. bitwa przedłuża pole walki.
function drawBackdrop(ctx) {
  if (G.screen.backdrop) { G.screen.backdrop(ctx); return; }
  ctx.drawImage(Layers.get(`backdrop_${VW}x${VH}`, VW, VH, c => {
    stoneFill(c, 0, 0, VW, VH); c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(0, 0, VW, VH);
    goldFrame(c, OX, OY, W, H);
  }), 0, 0, VW, VH);
}
function frame(ts) {
  const t = ts / 1000, dt = G.last ? Math.min(0.05, Math.max(0, t - G.last)) : 0; G.last = t;
  try { update(dt); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function init() {
  loadSettings();
  G.canvas = document.getElementById('game'); G.ctx = G.canvas.getContext('2d');
  resize(); window.addEventListener('resize', resize); bindInput();
  SaveStore.init(); // ustala miejsce zapisów w tle (konto Claude albo przeglądarka)
  setScreen('menu'); G.fade.a = 1; G.fade.target = 0;
  requestAnimationFrame(frame);
}
init();
</script>
