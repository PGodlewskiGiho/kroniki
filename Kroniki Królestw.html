<script>'use strict';
/* =====================================================================================
   KRONIKI KRÓLESTW — turowa strategia fantasy w klimacie klasycznych gier o bohaterach.
   Jeden plik HTML, czysty JavaScript i Canvas 2D, bez bibliotek.

   SPIS TREŚCI (działy w kolejności w pliku; szukaj po "// ==================== NAZWA")
     KONFIGURACJA I DANE PODSTAWOWE  stałe, surowce, trudność, mapy, kolory, bonusy, ROADMAP
     DANE: TEREN I RUCH              TERRAINS/ROADS (koszty ruchu i palety kolorów)
     DANE: STWORZENIA                CREATURES: statystyki i wygląd (look) jednostek
     DANE: FRAKCJE, BOHATEROWIE...   HERO_CLASSES, FACTIONS, BUILDINGS, MINES
     DANE: ARTEFAKTY I ROZWÓJ...     PRIMARY, CLASS_GROWTH, poziomy, EQUIP_SLOTS, ARTIFACTS
     DANE: CZARY                     SPELLS, efekty i opisy; GUILD_OFFER, CLASS_SPELLS
     DANE: OBIEKTY MAPY              SITES: kapliczki, studnie, młyny, obozy… (działanie w ZASADY GRY)
     STAN GRY I USTAWIENIA           G (program), miejsca graczy (slots), ME = człowiek przy ekranie, skróty: human, hero...
     NARZĘDZIA                       losowość, szum, A*, kolory
     RYSOWANIE: PODSTAWY I PIXEL ART tekst, cache warstw, sprite(), drawSprite(), blit()
     INTERFEJS                       kamień, pergamin, Button, showDialog, drawCost, pasek surowców
     GRAFIKA OBIEKTÓW                jeden rysunek na obiekt: surowce, kopalnie, stwory, bohater, miasto
     GRAFIKA: PORTRETY BOHATERÓW     pixel art 36×36, wygląd z HERO_LOOKS albo losowany z imienia
     GRAFIKA: OBLĘŻENIE              mur, brama i wieże na polu bitwy (castleSprite), bruk dziedzińca
     GRAFIKA: STWORY TWIERDZY I INFERNA  ciała 'insect', 'lizard', 'bull', 'hydra'
     GRAFIKA: SKARBCE                drawBank, bankSprite: krypta, warownia, gniazdo, leże hydr, Smocza Utopia
     ŚWIAT: TWORZENIE NOWEJ GRY      generateMap, placeObjects, createTown, createHero, createNewGame
     ZASADY GRY                      ruch, ścieżki, obiekty, potyczki, armie, rekrutacja, dochód, budowa
     BITWA: ZASADY                   pole heksów, obrażenia, kolejka, SI, simulateBattle, resolveBattle
     ZAPIS I ODCZYT GRY              serializeGame/deserializeGame, SaveStore (konto Claude albo przeglądarka)
     MAPA PRZYGODY: RENDEROWANIE     teren piksel po pikselu, minimapa, mgła, kamera
     MIASTO: GRAFIKA                 style frakcji, siedliska Przystani, Kniei i Kurhanu, sceny w perspektywie, efekty
     MIASTO: TWIERDZA I INFERNO … LOCH I CYTADELA   palety, siedliska i barwy scen pozostałych frakcji
     MIASTO: GENERATOR PLANSZ        krajobraz, rozmieszczenie budowli, drogi, pogoda (townLayout)
     MIASTO: BUDOWLE GŁÓWNE FRAKCJI  ratusz, fort, gildia, karczma, rynek, kuźnia, magazyn: własna architektura każdej frakcji
     EKRANY / MAPA / BOHATER / BITWA / MIASTO  menu, listy, mapa, ekran bohatera, bitwa, widok miasta
     SILNIK                          pętla, wejście (mysz, dotyk, klawiatura, kółko), przejścia

   ZASADY, KTÓRYCH SIĘ TRZYMAMY
   • Jedno źródło prawdy. Dane frakcji tylko w FACTIONS, kolory terenu tylko w TERRAINS/ROADS,
     obietnice typu „w kroku 7” tylko w ROADMAP, dochód tylko w dailyIncomeAll().
   • G.state to dane rozgrywki bez grafiki; cały świat tworzy createNewGame(), ekrany tylko go pokazują.
     Nowe pole w stanie = sprawdź serializeGame(): dane zapisują się same, jeśli są zwykłym JSON-em.
     Zapis jest możliwy tylko, gdy nikt się nie rusza (canSaveNow), bo h.pending to funkcja.
     Zmiana formatu zapisu = podbij SAVE_VERSION (stare zapisy zostaną wtedy odrzucone z komunikatem).
   • Obiekt gry ma JEDEN rysunek wektorowy w GRAFICE OBIEKTÓW. Mapa i interfejs pokazują ten sam
     sprite: mapa przez blit(), interfejs przez drawSprite(ctx, sprite, x, y, k)
     (k = 1 to rozmiar jak na mapie). Nie rysuj obiektów w interfejsie funkcjami wektorowymi wprost.
   • Właściciel zamiast „gracza 0”: kolory przez ownerColor(st, owner), gracz-człowiek to ME.

   • Testy: npm test (katalog tests/, Chromium bez okna przez Playwright). Po zmianie zasad gry dopisz test;
     createNewGame(S, seed) ze stałym seedem daje zawsze ten sam świat.

   WSPÓŁRZĘDNE I JEDNOSTKI
   • Ekran logiczny W×H = 800×600; płótno skaluje się do okna (G.rs).
   • Pole mapy T = 32 px logiczne; świat rysujemy w buforze o połowie rozdzielczości,
     więc 1 piksel grafiki = 2 px logiczne (AP = 16 pikseli grafiki na pole).
   • Obiekt 3×2 (miasto) i 2×2 (kopalnia) stoi na polu wejścia (x, y); pozostałe pola to ob.blocks.

   JAK DODAĆ…
   • Stworzenie: wpis w CREATURES z look.kind ('hum', 'wolf', 'griffin', 'rider', 'centaur',
     'unicorn', 'phoenix', 'ghost', 'dragon', 'eye', 'bird' i in.); nowy rodzaj ciała = nowy case w drawCreature().
   • Frakcję: wpis w FACTIONS, TOWN_ART (paleta), BUILD_ART (siedliska w pliku frakcji, budowle główne w MIASTO: BUDOWLE
     GŁÓWNE FRAKCJI — z nich powstaje też ikona miasta na mapie), TOWN_LAYOUTS (rozmiary miejsc i barwy ziemi)
     i TOWN_STYLE (ulubione krajobrazy, woda, rekwizyty, niebo, pogoda, dachy, mury); plansze miast układa generator (18c).
   • Budowlę wspólną: wpis w BUILDINGS (slot = miejsce w scenie) i funkcja w BUILD_ART każdej frakcji.
   • Ekran: G.screens.nazwa = { enter(p), draw(ctx), update(dt), onClick(x, y), onBack(),
     onKey(k), onWheel(d), onPointerDown/Move/Up, rightInfo(x, y) → tekst dymka, buttons: [] };
     przejście przez G.go('nazwa', parametry).

   HISTORIA
   Kroki 1–6: menu i nowa gra, generator mapy, bohater i mgła wojny, obiekty na mapie,
   panel boczny, miasta trzech frakcji. Po kroku 6: porządki (usunięty nieużywany renderer
   wektorowy i stare wersje scen miast), kod ułożony według działów, spójna grafika mapy
   i interfejsu. Dalej: rekrutacja (7), ekran bohatera i artefakty (8), bitwy (9–10),
   czary (11), zdobywanie miast (13). Zapis i odczyt gry zrobiony wcześniej, zaraz po porządkach.
   Krok 7: rekrutacja (pule siedlisk, przyrost tygodniowy), armie bohatera i garnizonu, wymiana oddziałów,
   Krok 8: ekran bohatera, poziomy i cechy (atak, obrona, moc, wiedza), 20 artefaktów na mapie i w ekwipunku.
   Krok 9: bitwy taktyczne na heksach (ruch, walka wręcz, strzelanie, kontratak, czekanie, obrona, SI,
   walka automatyczna, ucieczka, porażka). Krok 10: zdolności jednostek (ABILITIES), przeszkody na polu bitwy,
   SI licząca opłacalność wymiany (tradeValue).
   Krok 11: czary (SPELLS): mana z wiedzy, gildie magów, księga czarów, czary w bitwie i na mapie.
   Grafika: postacie z cieniowaniem i pozami (drawHumanoid/horse/griffin/drawDragon…), w bitwie w podwójnej
   rozdzielczości z animacją (battleSprite), efekty bitwy BattleFX (cząsteczki, pociski, pioruny, poświaty).
   Krok 12: testy automatyczne (tests/), bitwa z dowolną armią: potwór, bohater albo miasto (garnizon + bohater
   w mieście), czary bohatera obrońców, pokonany bohater znika, zwycięstwo nad miastem zmienia właściciela;
   surowce, budowa i rekrutacja liczone dla właściciela (playerOf), nie tylko dla gracza-człowieka.
   Krok 13: miasta niezależne w pozostałych miejscach startowych (createNeutralTown: losowa frakcja, garnizon
   rośnie z odległością i trudnością), zdobywanie miast (startTownAssault; puste zajmuje się bez walki),
   mury Fortu/Cytadeli/Zamku dają obrońcom premię do obrony (TOWN_WALL_DEF; od etapu 2 krok 9 tylko szacunek siły SI,
   w bitwie mury stoją na polu: oblężenie z bramą, wieżami i katapultą, setupSiege).
   Krok 14: tawerna (tavernOffer/hireHero: dwóch chętnych na tydzień, HERO_COST, najwyżej MAX_HEROES),
   wielu bohaterów: blokują sobie drogę, kliknięcie własnego wybiera go, wejście na wrogiego = bitwa,
   ruch wszystkich bohaterów w pętli ekranu mapy, przewijana lista w panelu (panelItems, listScroll).
   Krok 15: przeciwnicy komputerowi (GRACZE KOMPUTEROWI: aiTurn po turze człowieka; budowa według AI_BUILD_ORDER,
   dokupowanie surowców na rynku, werbunek, najem, cele z mapy odległości aiReach, próbna walka aiWorthFight,
   rozejm AI_PEACE_DAYS zależny od trudności), koniec gry (gameResult: wygrana po pokonaniu rywali, porażka bez
   miast i bohaterów albo po NO_TOWN_DAYS dniach bez miasta), najlepsze wyniki (recordScore), wybór liczby rywali.
   Po kroku 15 (etap 1): rynek dla gracza (marketLot/trade, okno showMarket; kurs zależy od liczby rynków,
   te same zasady dla SI w buyMissing). Menu w stylu pikselowym.
   Tura przeciwnika na żywo: aiAllTurns (dziś turnsAfter) to generator akcji (kroki, obrona), ekran mapy odtwarza go w updateAi
   (widoczne ruchy z animacją), atak na gracza pyta o walkę (askDefense) i otwiera bitwę z graczem po prawej
   (ekran bitwy: this.me, onDone). doEndTurn() bez opcji (testy) liczy wszystko od razu, z obroną automatyczną.
   Spotkanie bohaterów (showMeeting). Mgła wojny dla SI: reveal(…, owner) odkrywa teren każdemu graczowi,
   aiReach i aiPickTarget widzą tylko odkryte pola, a bez lepszego celu bohater SI idzie na zwiad (cel explore).
   Podział pliku: źródła w src/ (szablon.html + src/js/NN-dział.js, jeden plik na dział), build.js skleja je
   w „Kroniki Królestw.html” (npm run build / watch), a npm test najpierw sprawdza, czy plik jest aktualny.
   Okno dopasowane do ekranu: logiczne okno VW×VH (co najmniej W×H, do VW_MAX×VH_MAX) zamiast stałego 4:3.
   Mapa przygody (fill: true) wypełnia całe okno (layoutAdventure), menu maluje scenę na całą szerokość,
   pozostałe ekrany i okna dialogowe są wyśrodkowane (OX, OY) na tle drawBackdrop / screen.backdrop.
   Krok 6: morale i szczęście (armyMorale, heroLuck; B.morale / B.luck liczone w createBattle). Morale dodatnie
   daje drugi ruch po ataku (nextActive), ujemne wahanie i utratę tury; szczęście podwaja, pech połowi obrażenia (strike).
   Krok 7: umiejętności drugorzędne (SKILLS, h.skills = [{ id, lv }], najwyżej 8, poziomy 1–3). Awans daje wybór
   z dwóch (skillOffer: ulepszenie + nowa), SI wybiera wg AI_SKILL_ORDER. Działanie: skillVal() w ruchu, widzeniu,
   manie, dochodzie, koszcie terenu (baseCost z bohaterem), obrażeniach (damageRoll, spellDamage), morale,
   szczęściu, doświadczeniu i nekromancji (raiseDead po zwycięstwie).
   Grafika po krokach 8–12: portrety bohaterów w pixel arcie (drawHeroPortrait, własny wygląd każdego bohatera
   w HERO_LOOKS), mury oblężenia jako jeden sprite (castleSprite: kurtyna z blankami, brama między basztami,
   okrągłe wieże z gankiem; wyłom to dziura z gruzem), bruk dziedzińca w tle bitwy.
   Etap 2, krok 10: czary 4. i 5. poziomu (deszcz meteorów, modlitwa, wskrzeszenie, implozja, armagedon,
   przyspieszenie armii), gildie IV i V (GUILD_MAX), cele 'livingAlly', 'all' i 'allies' (spellArea z B),
   księga czarów w trzech kolumnach, gdy czarów jest wiele.
   Grafika mapy: ruda jako ciemne bryłki, góry/drzewa/skały ze ściankami (8 wariantów gór), ozdoby na pustych polach.
   Dźwięk: efekty i muzyka syntezowane w Web Audio; później usunięte w całości (słabe brzmienie, koszt na słabym PC).
   Statki: obiekt 'boat' na wodzie, h.boat (passableTile/legOk: w łodzi tylko woda, brzeg jako cel; wysiadka kończy ruch),
   stocznia (buyBoat, shipyardSpot, tylko w mieście nad wodą), darmowe łodzie przy brzegach.
   Nowe frakcje: Twierdza (bagna: gnolle, jaszczuroludzie, ważki, bazyliszki, gorgony, wywerny, hydry) i Inferno (lawa:
   chochliki, gogi, ogary, demony, czarty, ifryty, diabły); klasy beastmaster/witch i demoniac/heretic, portrety, miasta, muzyka.
   Hot-seat i do 8 graczy: 8 miejsc na ekranie nowej gry (settings.slots: człowiek/komputer/wolne, kolor, frakcja),
   ME to numer człowieka przy ekranie (setViewer: jego mgła, kamera, wybrany bohater), kolejka tur turnsAfter
   (komputery po kolei, nowy dzień advanceDay przy końcu listy), zasłona między ludźmi, wieści w skrzynkach graczy
   (tell/takeInbox), obrona innego człowieka przed atakiem komputera, bitwa człowiek na człowieka (obie strony ręcznie),
   zwycięzca = ostatni gracz na placu. Miejsc na miasta: 4/6/8/10 zależnie od mapy (SITE_COUNT).
   Imiona graczy: pole tekstowe askText (prawdziwy <input> nad oknem), slot.name → player.name, playerName.
   Podział oddziału: splitLimit/armySplit, okno showSplit (przycisk „Dziel” albo Shift+klik) w spotkaniu, mieście i u bohatera.
   Wydajność: klatka rysowana tylko w razie potrzeby (screen.fps, G.dirty), kamienne tło i pergamin z pamięci (Layers, drawLayer
   w całych pikselach), mapa bez przeliczania całego obrazu co klatkę (gradeCanvas w kawałkach terenu i kopiach sprite'ów, mgła
   w kawałkach fogChunk, nakładka mapLight), scena menu i efekty miasta ~12–15 klatek/s, jakość grafiki (auto/wysoka/niska, Perf).
   Kawałki terenu: budżet ~10 ms na klatkę (MapRender.get allow, zastępczy placeholder), generowanie wokół widoku z wyprzedzeniem.
   Generator plansz miast (18c): każde miasto ma własną planszę z nazwy (townLayout): krajobraz (dolina, jezioro, przepaść,
   tarasy, wyspy, płaskowyż, krater, wybrzeże), kamera, 14 budowli rozmieszczonych według ról (bez zasłaniania, nie w wodzie
   ani na drodze), droga z mostami i schodami, plac, mur z bramą, drzewa i drobiazgi, pora dnia, pogoda (deszcz, mgła, śnieg),
   dachy i odbicia budowli. Nowe elementy sceny: tarasy z murem oporowym, wyspy, morze z plażą i łodziami, mury i baszty.
   Akademia (śnieg, TER.SNOW): gremliny, gargulce, golemy, magowie, dżiny, nagi (nowy wężowy ogon L.serpent), olbrzymi i tytani;
   klasy Alchemik i Czarodziej, miasto białych wież ze złotymi kopułami i padającym śniegiem (18b), mury i portrety. Pocisk z look.orb
   bez laski to kula (gremlin, tytan). SI bierze z garnizonu tylko to, co zmieści (takeableArmy), więc nie krąży między miastami.
   Loch (skały, TER.ROUGH) i Cytadela (step, TER.SAND), 18d: nowe ciała 'eye' (obserwator) i 'bird' (rok, ptak gromu),
   czworonóg z wings/stinger/mane/horns/stripes/rider (mantykora, behemot, jeździec wargów), cyklop (L.cyclops), tur bez łusek
   (L.plain, barding). Woda 'glow' i 'oasis', rekwizyty glowShroom/stalagmite/acacia/cactus/totem, pogoda 'spores' i 'dust'.
   Koniec bitwy (22, startEnding/endingStep/drawEnding): zwycięstwo = złote promienie, fajerwerki, konfetti, sztandar ze sprężystym
   wejściem i podskakujący zwycięzcy; porażka = szarość, czerwona winieta, popiół i dym, opadający postrzępiony sztandar z pęknięciem.
   Pory roku (SEASONS, seasonIdx: miesiąc 1 wiosna, 2 lato, 3 jesień, 4 zima, potem od nowa): lato +10% ruchu, jesień +1 drewna
   i rudy z miasta, zima −20% ruchu. Wygląd: seasonLand (barwy terenu), lód przy brzegach, drzewa i ozdoby wg SEASON_DRAW
   (obstacleSprite/decorSprite z porą w kluczu), MapRender.setSeason czyści kawałki, drawSeasonFx (śnieg, liście).
   Budowle główne każdej frakcji od nowa (18e): Przystań — ratusz z muru pruskiego z dzwonnicą, magistrat i kapitol, zamek z fosą,
   zwodzonym mostem i bramą między basztami, gotycka gildia, sukiennice, wiatrak; Knieja — drzewo z pomostami, żywopłoty
   z bramą z drzew, krąg druidów; Kurhan — kopiec z dolmenem i czaszką, brama-czaszka, obeliski; Twierdza — dom na palach z dachem
   siodłowym, piramidy schodkowe, chata na kurzych łapach, pływający targ; Inferno — fasada-twarz demona, rogi, wulkan, zigurat
   ognia; Akademia — cebulaste kopuły i minarety, kryształowe pylony, latająca cytadela i biblioteka; Loch — fasady wykute
   w skale, twarz władcy, geoda, wózki kopalniane; Cytadela — jurta z czaszką bestii, cyklopowe mury, kamienny łeb, namiot
   szamana. Ikona miasta na mapie to pomniejszony fort frakcji (drawTownMap), flagi na masztach z rysunku (townFlagPoints).
   Cechy frakcji (FACTION_TRAITS, heroFaction z klasy bohatera): morale Przystani, szczęście Kniei, nekromancja Kurhanu,
   bagna Twierdzy, siarka Inferna, zima i śnieg Akademii, wzrok Lochu, przyrost Cytadeli; opisy w dymkach (nowa gra, miasto, bohater).
   Słaby laptop: menu i miasto bez pixelQuantize co klatkę (paleta wypalona w nieruchomym tle), płótno bez przezroczystości
   (alpha: false), bufory mapy, mgły i sprite'ów bez willReadFrequently (przy karcie graficznej zostają na niej), niska jakość
   = pół piksela płótna na piksel ekranu i bez fal na wodzie, Perf schodzi do 0,5 także przy spóźnionych klatkach, licznik pod F.
   Porządki i trudniejsza mapa: potwory neutralne to też jednostki frakcji (poziomy 1–7, fillNeutrals), siła rośnie
   wykładniczo z odległością od najbliższego startu (MONSTER_POWER, d01) i z trudnością, potwory rosną co tydzień
   (MONSTER_GROW do MONSTER_GROW_MAX). Skarbce BANKS (Krypta, Orcza warownia, Gniazdo gryfów, Leże hydr, Smocza Utopia):
   załoga z kilku oddziałów, łup (lootBank), puste po zwycięstwie; SI też je rozbija. migrateSave naprawia stare zapisy.
   Balans: Kurhan silniejszy, hydra bez regeneracji, bazyliszek bez „bez odwetu”; test balansu frakcji (30–70% wygranych).
   Szlify grafiki: żywa woda (WaterFx: fale po głębi i pulsująca piana, maski wody fragmentów mapy), wyraźniejsze świerki,
   zwęglone drzewa z żarem na lawie, surowce jako bryłki w stylu rudy, tła bitew ze szczegółami terenu (battleDecor).

   PLAN (kolejność ustalona z graczem; krok 13 „warunki zwycięstwa” pominięty)
   1. Dźwięk (zrobione). 2. Nowe frakcje (zrobione: Twierdza i Inferno). 3. Statki (zrobione: stocznia, łodzie). 4. Hot-seat (zrobione: do 8 graczy, zasłona między turami).
   5. Samouczek (wykreślony). 6. Porządki (zrobione: migracja zapisów, test balansu, trudniejsza mapa i skarbce).
   7. Grafika (zrobione: animowana woda, świerki, surowce w stylu rudy, tła bitew zależne od terenu).
   ===================================================================================== */

  if (!PLAYER_COLORS.some(c => c.id === S.color)) S.color = 'red';
  if (!BONUSES.some(b => b.id === S.bonus)) S.bonus = 'gold';
  if (!FACTIONS.some(f => f.id === S.faction)) S.faction = 'haven';
  delete S.sfx; delete S.mus; // głośności z czasów, gdy gra miała dźwięk
  if (!['auto', 'high', 'low'].includes(S.quality)) S.quality = 'auto';

const SLOT_TYPES = ['human', 'ai', 'off'];
function validSlots(a) {
  if (!Array.isArray(a) || a.length !== MAX_PLAYERS) return null;
  const used = new Set(), out = a.map(o => ({ type: SLOT_TYPES.includes(o && o.type) ? o.type : 'off', color: o && o.color, name: o && typeof o.name === 'string' ? o.name.trim().slice(0, 16) : '', faction: o && (o.faction === 'random' || FACTIONS.some(f => f.id === o.faction)) ? o.faction : 'random' }));
  for (const o of out) { if (!PLAYER_COLORS.some(c => c.id === o.color) || used.has(o.color)) o.color = null; else used.add(o.color); }
  for (const o of out) if (!o.color) { o.color = PLAYER_COLORS.find(c => !used.has(c.id)).id; used.add(o.color); }
  if (!out.some(o => o.type === 'human')) out[0].type = 'human';

}

// Spotkanie dwóch bohaterów gracza (stoją obok siebie): wymiana oddziałów i artefaktów z plecaka.

function showMeeting(st, a, b, onMsg) {

    onClick(px, py) {
      const s = armyAt(px, py), g = bagAt(px, py);

// --- artefakty: jeden rysunek (24×24 jednostki wokół 0,0) dla mapy, okien i ekranu bohatera ---
function drawArtifact(c, id) {
  const A = ARTIFACTS[id], col = A.col, gem = A.gem, dk = shadeHex(col, -0.4), lt = shadeHex(col, 0.35);
  const poly = (pts, f) => { c.fillStyle = f; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill(); };
  c.lineCap = 'round'; c.lineJoin = 'round';
  switch (A.icon) {
    case 'sword':
      poly([[-9, 9], [5, -5], [8, -8], [7, -4], [-7, 10]], col); c.strokeStyle = lt; c.lineWidth = 1; c.beginPath(); c.moveTo(-7, 8); c.lineTo(6, -6); c.stroke();
      c.strokeStyle = '#6a4424'; c.lineWidth = 2.6; c.beginPath(); c.moveTo(-8, 3); c.lineTo(-3, 8); c.stroke();
      c.strokeStyle = '#3a2410'; c.beginPath(); c.moveTo(-6, 6); c.lineTo(-10, 10); c.stroke(); circ(c, -10.5, 10.5, 1.8, gem); break;
    case 'axe':
      c.strokeStyle = '#6a4424'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(-8, 10); c.lineTo(5, -7); c.stroke();
      poly([[1, -9], [9, -11], [11, -3], [6, 2], [3, -3]], col); poly([[3, -8], [8, -9], [9, -4]], lt); break;
    case 'shield':
      poly([[-9, -9], [9, -9], [9, 0], [0, 11], [-9, 0]], col); poly([[-9, -9], [0, -9], [0, 11], [-9, 0]], shadeHex(col, -0.15));
      c.strokeStyle = gem; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -7); c.lineTo(0, 7); c.moveTo(-6, -2); c.lineTo(6, -2); c.stroke(); break;
    case 'helm':
      c.fillStyle = col; c.beginPath(); c.arc(0, 1, 9, Math.PI, 0); c.lineTo(9, 8); c.lineTo(-9, 8); c.closePath(); c.fill();
      c.fillStyle = '#1a1a22'; c.fillRect(-7, 1, 14, 3); c.fillStyle = gem; c.fillRect(-1, -8, 2, 16); c.fillStyle = lt; c.fillRect(-6, -4, 3, 3); break;
    case 'crown':
      poly([[-10, 7], [-10, -5], [-5, 0], [0, -9], [5, 0], [10, -5], [10, 7]], col); c.fillStyle = dk; c.fillRect(-10, 4, 20, 3);
      circ(c, 0, -2, 2, gem); circ(c, -6, 3, 1.5, gem); circ(c, 6, 3, 1.5, gem); break;
    case 'amulet':
      c.strokeStyle = col; c.lineWidth = 1.5; c.beginPath(); c.arc(0, -4, 8, Math.PI * 0.1, Math.PI * 0.9, true); c.stroke();
      poly([[0, 1], [6, 6], [0, 12], [-6, 6]], col); poly([[0, 3], [4, 6], [0, 10], [-4, 6]], gem); break;

  const close = new Button(W / 2 - 70, y + hh - 54, 140, 40, 'Zamknij', () => { G.modal = null; }, { key: 'escape', size: 17 });

    buttons: [close],

    rightInfo(px, py) { const i = list.findIndex((id, k) => inRect(px, py, cell(k))); if (i < 0) return null; const S = SPELLS[list[i]]; return `${S.name} (poziom ${S.level}, ${S.kind === 'battle' ? 'w bitwie' : 'na mapie'}, koszt ${S.cost} many): ${S.desc(sp)}.`; },
    draw(ctx) {
      hover = list.findIndex((id, k) => inRect(G.mouse.x, G.mouse.y, cell(k)));
      dimScreen(ctx, 0.5); drawParchment(ctx, x, y, w, hh);
      text(ctx, 'Księga czarów', W / 2, y + 34, { size: 26, align: 'center', color: '#3a1e08', fam: 'title' });
      text(ctx, `${h.name} · mana ${h.mana} / ${heroMaxMana(h)} · moc czarów ${sp}`, W / 2, y + 58, { size: 14, weight: 500, align: 'center', color: '#5a3814' });
      if (!list.length) text(ctx, 'Bohater nie zna jeszcze żadnych czarów. Odwiedź miasto z gildią magów.', W / 2, y + 200, { size: 15, italic: true, weight: 500, align: 'center', color: '#7a5a34' });
      list.forEach((id, i) => {
        const r = cell(i), S = SPELLS[id], ok = usable(id);

        text(ctx, S.name, r.x + 46, r.y + r.h / 2 - 7, { size: fs, color: '#2a1606', fam: 'title' });
        text(ctx, cols > 2 ? `${S.level} poz. · ${S.cost} many` : `${S.level} poz. · ${S.cost} many · ${S.kind === 'battle' ? 'bitwa' : 'mapa'}`, r.x + 46, r.y + r.h / 2 + 11, { size: 12, weight: 500, color: '#5a3814' });
        ctx.restore();
      });

      text(ctx, hs ? `${hs.name}: ${hs.desc(sp)}.` : mode === 'view' ? 'Prawy przycisk na czarze: pełny opis.' : `Kliknij czar, aby go rzucić (${mode === 'battle' ? 'jeden na rundę' : 'na mapie'}).`,

// ==================== GRAFIKA: OBLĘŻENIE ===================================================
// Mury miasta na polu bitwy (setupSiege: jeden fragment na każdy rząd heksów kolumny SIEGE_X), w tym samym
// widoku z góry pod kątem co jednostki: mur to pionowy pas przez całe pole – od strony atakujących lico
// z cegieł i rząd blanek, dalej chodnik i przedpiersie od strony miasta. Fragmenty nie zachodzą na siebie,
// więc wyłom jest widoczną dziurą w murze. Wieże strzelnicze to okrągłe baszty z gankiem i dachem,
// brama to łukowy przejazd między dwiema basztami, z mostem zwodzonym.
// Jednostki: px logiczne; (0, 0) = zachodnia krawędź muru (x = SIEGE_WX) na wysokości środka rzędu.
// Cały mur to jeden sprite (pixel art), rysowany zanim staną oddziały.
const SIEGE_WX = 532, SIEGE_HALF = 23.5, TOWER_H = 56;
const WALL = { face: 13, walk: 50, depth: 16 }; // lico 0..face, chodnik face..walk; depth: wysokość czoła muru widocznego od południa
const SIEGE_STONE = { haven: '#b8ae98', sylvan: '#9aa086', barrow: '#6c6676', fortress: '#8e8a6a', inferno: '#5e403c', academy: '#c4c8d2', dungeon: '#5a5260', stronghold: '#b08a5a' };
function stonePal(fac) {
  const c = SIEGE_STONE[fac] || SIEGE_STONE.haven;
  return { top: LT(c, 0.22), lit: LT(c, 0.08), base: c, sh: DK(c, 0.25), dk: DK(c, 0.45), mortar: DK(c, 0.34), crack: '#201a1a', moss: fac === 'sylvan' ? '#5a7a34' : fac === 'barrow' ? '#3e4e3a' : '#6a7a44' };
}
const rect = (ctx, x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
function sPennant(ctx, [x, y], col) { limb(ctx, x, y, x, y - 9, 1.5, '#2a1a0e'); fillPoly(ctx, [[x, y - 9], [x + 10, y - 7], [x, y - 4]], col); }
// Cegły w prostokącie: rzędy co 6 px, spoiny co 10 px na przemian, kilka jaśniejszych i ciemniejszych kamieni
function bricks(ctx, x, y, w, h, S, r, fill = S.base) {
  rect(ctx, x, y, w, h, fill);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  for (let yy = y, row = 0; yy < y + h; yy += 6, row++) {
    for (let xx = x - (row % 2) * 5; xx < x + w; xx += 10) { const v = r(); if (v < 0.3) rect(ctx, xx + 1.6, yy + 1.6, 8.4, 4.4, v < 0.14 ? S.lit : S.sh); rect(ctx, xx, yy, 1.6, 6, S.mortar); }
    rect(ctx, x, yy + 4.4, w, 1.6, S.mortar);
  }
  ctx.restore();
}

// kind: 'wall' | 'gate' | 'tower'; state: 'ok' | 'hit' | 'down'; open: od południa brak muru (widać czoło); col: kolor właściciela
function drawSiegePiece(ctx, fac, kind, state, open, col) {
  const S = stonePal(fac), A = TOWN_ART[fac] || TOWN_ART.haven, h = SIEGE_HALF, { face, walk, depth } = WALL;
  const r = mulberry32((kind === 'gate' ? 50 : kind === 'tower' ? 90 : 3) + (state === 'hit' ? 100 : state === 'down' ? 200 : 0));
  ctx.fillStyle = S.top; ctx.fillStyle = S.lit; ctx.fillStyle = S.base; ctx.fillStyle = S.sh; ctx.fillStyle = S.dk; ctx.fillStyle = S.mortar; // paleta sprite'a
  if (state === 'down' && kind === 'wall') return drawRubble(ctx, S, r);
  // cień muru na dziedzińcu (dithering)
  ctx.fillStyle = S.dk; for (let y = -h; y < h; y += 2) for (let x = walk; x < walk + 10; x += 2) if (((x + y) / 2 & 3) === 0 || x === walk) ctx.fillRect(x, y, 2, 2);
  // lico od strony atakujących, cokół u podstawy
  bricks(ctx, 0, -h, face, 2 * h, S, r, S.base);
  rect(ctx, -4, -h, 4, 2 * h, S.sh); rect(ctx, -4, -h, 1.6, 2 * h, S.lit);
  for (let i = 0; i < 3; i++) rect(ctx, -4 + r() * 6, -h + r() * (2 * h - 6), 3, 4 + r() * 4, S.moss);
  // chodnik: płyty
  rect(ctx, face, -h, walk - face, 2 * h, S.top);
  for (let y = -h + 4, k = 0; y < h; y += 8, k++) { rect(ctx, face, y, walk - face, 1.6, S.lit); rect(ctx, face + 6 + (k % 2) * 9, y, 1.6, 8, S.lit); rect(ctx, face + 24 + (k % 2) * 9, y, 1.6, 8, S.lit); }
  // przedpiersie od strony miasta
  rect(ctx, walk - 6, -h, 6, 2 * h, S.base); rect(ctx, walk - 6, -h, 6, 2, S.lit); rect(ctx, walk - 1.6, -h, 1.6, 2 * h, S.dk);
  // blanki nad licem: góra zęba jasna, jego czoło (od południa) w cieniu, między zębami strzelnice
  const skip = state === 'hit' ? [1, 3] : [];
  rect(ctx, face - 3, -h, 11, 2 * h, S.dk);
  for (let y = -h + 1, k = 0; y < h - 4; y += 11.75, k++) { if (skip.includes(k)) { rect(ctx, face - 3, y, 11, 6, S.sh); continue; } rect(ctx, face - 4, y, 12, 6, S.top); rect(ctx, face - 4, y + 6, 12, 4, S.sh); rect(ctx, face - 4, y, 1.6, 10, S.lit); }
  for (const y of [-11, 7]) rect(ctx, 4, y, 3, 8, '#16121a'); // strzelnice w licu
  if (open) { bricks(ctx, -4, h, walk + 4, depth, S, r, S.sh); rect(ctx, -4, h, walk + 4, 2, S.top); } // czoło przy wyłomie
  if (state === 'hit') {
    ctx.strokeStyle = S.crack; ctx.lineWidth = 2;
    for (const [x, y] of [[3, -16], [26, 2], [8, 8]]) { let xx = x, yy = y; ctx.beginPath(); ctx.moveTo(xx, yy); for (let k = 0; k < 4; k++) { xx += (r() - 0.5) * 8; yy += 3 + r() * 4; ctx.lineTo(xx, yy); } ctx.stroke(); }
    fillPoly(ctx, [[face + 4, -6], [face + 16, -8], [face + 20, 2], [face + 8, 4]], S.dk); // wyrwa w chodniku
    for (let i = 0; i < 6; i++) { const x = -18 + r() * 14, y = -h + r() * 2 * h; rect(ctx, x, y, 4 + r() * 3, 3 + r() * 2, i % 2 ? S.base : S.sh); }
  }
  if (kind === 'tower') return drawRoundTower(ctx, S, A, col, walk / 2, 10, 27, TOWER_H);
  if (kind === 'gate') drawGate(ctx, S, A, state, col, r);
}
// Wyłom: rozsypane bloki na ziemi, widać ziemię i bruk
function drawRubble(ctx, S, r) {
  const h = SIEGE_HALF;
  for (let i = 0; i < 26; i++) {
    const x = -14 + r() * (WALL.walk + 8), y = -h + 2 + r() * (2 * h - 6), w = 4 + r() * 6, hh = 3 + r() * 4;
    rect(ctx, x, y, w, hh, S.base); rect(ctx, x, y, w, 1.6, S.top); rect(ctx, x, y + hh - 1.6, w, 1.6, S.sh);

  for (let i = 0; i < 4; i++) { const x = r() * WALL.walk, y = -h + r() * 2 * h; rect(ctx, x, y, 8 + r() * 6, 6 + r() * 3, S.sh); rect(ctx, x, y, 8, 2, S.lit); }
}

const strHash = s => { let h = 2166136261; for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return h >>> 0; };
const pickW = (r, list) => { let s = 0; for (const [, w] of list) s += w; let x = r() * s; for (const [v, w] of list) if ((x -= w) < 0) return v; return list[0][0]; };

const hillTop = (Hl, X) => Hl.h * Math.pow(Math.max(0, 1 - ((X - Hl.X) / Hl.rx) ** 2), Hl.flat || 0.65);

// --- typy krajobrazu: każdy dopisuje teren do planszy L i strefy pod budowę do T ---
const ARCHETYPES = {
  valley(r, St, W, L, T) { // rzeka w poprzek, za nią wzgórza (czasem z płaskim szczytem pod zamek)
    const Zr = between(r, 1.5, 1.85), tilt = between(r, -0.18, 0.18), wR = between(r, 56, 84), ph = r() * 6, pts = [];
    for (let i = 0; i <= 8; i++) { const X = -1000 + i * 250; pts.push([X, Zr + tilt * X / 1000 + Math.sin(i * 0.9 + ph) * 0.08]); }
    L.rivers.push({ w: wR, pts, cols: W.river, edge: W.edge, noReeds: !W.reeds });
    T.feats.push({ pts, w: wR + 24 }); T.river = { pts, w: wR };
    for (let k = 0, n = 1 + (r() < 0.6 ? 1 : 0); k < n; k++) { const Hl = { X: between(r, -520, 520), Z: Math.min(2.85, Zr + between(r, 0.5, 0.95)), rx: between(r, 220, 360), h: between(r, 40, 80), cols: St.hill, rock: r() < 0.5, flat: r() < 0.6 ? 0.18 : 0.65 }; L.hills.push(Hl); }
    T.focus = { X: between(r, -120, 120), Z: between(r, 1.15, 1.3) }; T.entryX = between(r, -70, 70);
  },
  lake(r, St, W, L, T) { // jezioro pośrodku, czasem wysepka z pomostem
    const Lk = { X: between(r, -100, 100), Z: between(r, 1.4, 1.65), rx: between(r, 130, 200), rz: between(r, 0.18, 0.26), cols: W.lake, rim: W.rim, reeds: W.reeds, hot: W.hot };
    L.lakes.push(Lk); T.ells.push(Lk);
    if (r() < 0.5) { const I = { X: Lk.X + between(r, -0.2, 0.2) * Lk.rx, Z: Lk.Z + between(r, -0.05, 0.1), rx: Lk.rx * 0.36, rz: Lk.rz * 0.4 }; L.islands.push(I); T.islands.push(I); T.focus = { X: I.X, Z: I.Z }; T.planks = true; }
    else T.focus = { X: Lk.X + (r() < 0.5 ? -1 : 1) * (Lk.rx + 80), Z: Lk.Z - Lk.rz * 0.4 };
    if (r() < 0.6) { const Hl = { X: between(r, -500, 500), Z: between(r, 2.45, 2.85), rx: between(r, 240, 360), h: between(r, 40, 80), cols: St.hill, rock: r() < 0.5, flat: 0.2 }; L.hills.push(Hl); }
    T.entryX = between(r, -60, 60);
  },
  chasm(r, St, W, L, T) { // przepaść biegnąca w głąb, most w poprzek, cytadela na skale na końcu
    L.pj = { hor: Math.round(between(r, 40, 70)), d: 330 };
    const Xc = between(r, -90, 90), bend = between(r, -140, 140), ph = r() * 6, pts = [];
    for (let i = 0; i <= 6; i++) pts.push([Xc + Math.sin(i * 1.1 + ph) * 26 + bend * i / 6, 0.78 + i * 0.26, 0, 170 - i * 20]);
    const C = W.chasm || TOWN_WATER.dark.chasm; L.rivers.push({ w: 150, chasm: true, pts, cols: C.cols, line: C.line, edge: C.edge, glow: C.glow, glowA: C.glowA, noReeds: true });
    T.feats.push({ pts, w: 190 }); T.chasm = { pts };
    const Sb = { x0: Xc + bend - between(r, 240, 380), x1: Xc + bend + between(r, 240, 380), Z0: 2.36, Z1: between(r, 2.8, 3.1), e: between(r, 50, 80), ...St.slab, jag: r() * 9 };
    L.slabs.push(Sb);
    const side = r() < 0.5 ? -1 : 1; T.focus = { X: Xc + side * between(r, 180, 240), Z: between(r, 1.2, 1.45) }; T.entryX = Xc - side * between(r, 150, 220);
  },
  terraces(r, St, W, L, T) { // stok z tarasami jeden nad drugim, schody zygzakiem
    const n = r() < 0.6 ? 3 : 2; let Z = between(r, 1.3, 1.45), e = 0;
    for (let k = 0; k < n; k++) { const Z0 = Z, Z1 = k === n - 1 ? 3.3 : Z0 + between(r, 0.38, 0.5); e += between(r, 34, 52) + k * 10; L.slabs.push({ x0: -1600, x1: 1600, Z0, Z1, e, ...St.slab, masonry: St.masonry, jag: St.masonry ? 0 : r() * 9 }); Z = Z1; }
    T.focus = { X: between(r, -140, 140), Z: between(r, 1.02, 1.15) }; T.entryX = between(r, -80, 80);
  },
  islands(r, St, W, L, T) { // mokradło od brzegu do brzegu, budowle na wysepkach połączonych kładkami
    const Lk = { X: 0, Z: 1.72, rx: 1500, rz: 0.62, cols: W.lake, rim: W.rim, reeds: W.reeds, hot: W.hot }; L.lakes.push(Lk); T.ells.push(Lk);
    const want = 8 + (r() * 3 | 0);
    for (let t = 0; t < 200 && T.islands.length < want; t++) {
      const Z = between(r, 1.15, 2.3), I = { X: between(r, -250, 250) * Z, Z, rx: between(r, 110, 200), rz: between(r, 0.08, 0.13) };
      if (T.islands.some(o => Math.abs(o.X - I.X) < (o.rx + I.rx) * 0.9 && Math.abs(o.Z - I.Z) < (o.rz + I.rz) * 1.3)) continue;
      T.islands.push(I); L.islands.push(I);
    }
    T.islands.sort((a, b) => a.Z - b.Z); const big = T.islands.reduce((a, b) => (b.rx * b.rz > a.rx * a.rz && b.Z < 1.8 ? b : a), T.islands[0]);
    T.focus = { X: big.X, Z: big.Z }; T.entryX = between(r, -60, 60); T.planks = true;
  },
  plateau(r, St, W, L, T) { // skalny płaskowyż z tyłu, na nim zamek; z przodu miasto na równinie
    const cx = between(r, -260, 260), hw = between(r, 230, 360);
    L.slabs.push({ x0: cx - hw, x1: cx + hw, Z0: between(r, 1.9, 2.15), Z1: between(r, 2.6, 2.9), e: between(r, 55, 90), ...St.slab, masonry: St.masonry && r() < 0.5, jag: r() * 9 });
    if (r() < 0.5) { const Lk = { X: cx + (r() < 0.5 ? -1 : 1) * between(r, 260, 360), Z: between(r, 1.35, 1.6), rx: between(r, 80, 120), rz: between(r, 0.1, 0.15), cols: W.lake, rim: W.rim, reeds: W.reeds, hot: W.hot }; L.lakes.push(Lk); T.ells.push(Lk); }
    T.focus = { X: cx + between(r, -120, 120), Z: between(r, 1.15, 1.35) }; T.entryX = between(r, -70, 70);
  },
  crater(r, St, W, L, T) { // pierścień skał dookoła, pośrodku jama (lawa, ciemna woda albo lód)
    L.pj = { hor: Math.round(between(r, 60, 80)), d: 310 };
    for (const X of [-560, 0, 560]) L.hills.push({ X: X + between(r, -80, 80), Z: between(r, 2.55, 2.9), rx: between(r, 260, 380), h: between(r, 60, 100), cols: St.hill, rock: true, flat: 0.5 });
    const Lk = { X: between(r, -90, 90), Z: between(r, 1.5, 1.75), rx: between(r, 110, 160), rz: between(r, 0.15, 0.22), cols: W.lake, rim: W.rim, hot: W.hot, pit: true }; L.lakes.push(Lk); T.ells.push(Lk);
    T.focus = { X: Lk.X + (r() < 0.5 ? -1 : 1) * (Lk.rx + between(r, 90, 140)), Z: Lk.Z - Lk.rz * 0.3 }; T.entryX = between(r, -70, 70);

    if (!G.mouse.down) return; G.mouse.down = false; const p = toLogical(e);
    if (G.longPress) { G.longPress = false; G.downTarget = null; return; }
    const consumed = (!G.modal && G.screen.onPointerUp) ? G.screen.onPointerUp(p.x, p.y, e) : false;
    if (!consumed && p.vx >= 0 && p.vx <= VW && p.vy >= 0 && p.vy <= VH) handleClick(p.x, p.y);
    G.downTarget = null; if (e.pointerType !== 'mouse') { G.mouse.x = G.mouse.y = G.mouse.vx = G.mouse.vy = -1; }
  });
  c.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !G.mouse.down) { G.mouse.x = G.mouse.y = G.mouse.vx = G.mouse.vy = -1; } });
  c.addEventListener('contextmenu', e => e.preventDefault());
  c.addEventListener('wheel', e => { G.dirty = true; if (!G.modal && !G.fade.next && G.screen.onWheel) { e.preventDefault(); G.screen.onWheel(Math.sign(e.deltaY)); } }, { passive: false });
  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', e => { G.keys.delete(e.key.toLowerCase()); G.dirty = true; });
  window.addEventListener('blur', () => { G.keys.clear(); G.dirty = true; });
}
// Okno gry wypełnia ekran: skala tak, by zmieścił się obszar W×H, a reszta szerokości albo wysokości
// (do VW_MAX×VH_MAX) poszerza okno logiczne. Wymiary parzyste, bo bufory pikselowe mają połowę rozdzielczości.
function resize() {
  const wrap = document.getElementById('wrap'), aw = Math.max(1, wrap.clientWidth), ah = Math.max(1, wrap.clientHeight);
  const s = Math.min(aw / W, ah / H);
  VW = clamp(Math.floor(aw / s / 2) * 2, W, VW_MAX); VH = clamp(Math.floor(ah / s / 2) * 2, H, VH_MAX);
  OX = (VW - W) / 2; OY = (VH - H) / 2;
  for (const k in Layers.cache) if (/_\d+x\d+$/.test(k)) delete Layers.cache[k]; // warstwy zależne od rozmiaru okna
  const cw = Math.max(1, Math.floor(VW * s)), ch = Math.max(1, Math.floor(VH * s));
  G.dpr = renderDpr(); G.scale = cw / VW; G.rs = G.scale * G.dpr; G.dirty = true;
  G.canvas.style.width = cw + 'px'; G.canvas.style.height = ch + 'px';
  G.canvas.width = Math.round(cw * G.dpr); G.canvas.height = Math.round(ch * G.dpr);
}
function update(dt) {
  G.time += dt; const f = G.fade, sp = 3.5;
  if (f.a < f.target) f.a = Math.min(f.target, f.a + dt * sp); else if (f.a > f.target) f.a = Math.max(f.target, f.a - dt * sp);
  if (f.next && f.a >= 1) { const n = f.next; f.next = null; setScreen(n.name, n.params); f.target = 0; }
  syncMouse(); updateHover(); if (G.screen.update) G.screen.update(dt);
}
function render() {
  // przesunięcie wyśrodkowanego ekranu w całych pikselach: przy ułamkowym każdy obraz byłby filtrowany (wolno i nieostro)
  const ctx = G.ctx, s = G.rs, center = () => ctx.setTransform(s, 0, 0, s, Math.round(OX * s), Math.round(OY * s));
  ctx.setTransform(s, 0, 0, s, 0, 0); ctx.clearRect(0, 0, VW, VH);
  if (G.screen.fill) G.screen.draw(ctx);
  else { if (OX || OY) drawBackdrop(ctx); center(); G.screen.draw(ctx); }
  if (G.modal) { center(); G.modal.draw(ctx); }
  ctx.setTransform(s, 0, 0, s, 0, 0);
  if (G.popup) drawPopup(ctx, G.popup);
  if (G.fade.a > 0) { ctx.fillStyle = `rgba(0,0,0,${G.fade.a.toFixed(3)})`; ctx.fillRect(0, 0, VW, VH); }
  if (G.showPerf) drawPerfInfo(ctx);
}
// Tło wokół wyśrodkowanego ekranu: kamień jak w ramkach gry, przyciemniony, ze złotą obwódką.
// Ekran może podać własne (screen.backdrop), np. bitwa przedłuża pole walki.
function drawBackdrop(ctx) {
  if (G.screen.backdrop) { G.screen.backdrop(ctx); return; }
  drawLayer(ctx, Layers.get(`backdrop_${VW}x${VH}`, VW, VH, c => {
    stoneFill(c, 0, 0, VW, VH); c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(0, 0, VW, VH);
    goldFrame(c, OX, OY, W, H);
  }), 0, 0);
}
// Klatkę rysujemy tylko wtedy, gdy trzeba: ekran podaje, ilu klatek na sekundę potrzebuje (screen.fps: liczba albo funkcja,
// domyślnie 4 dla ekranów bez animacji), a wejście (mysz, klawisze) i każda zmiana okna, dymka czy podświetlenia wymusza klatkę od razu.
// Na słabym komputerze to połowa sukcesu: nieruchomy ekran prawie nie zużywa procesora.
function screenFps() { const f = G.screen && G.screen.fps; return typeof f === 'function' ? f.call(G.screen) : (f || 4); }
function frame(ts) {
  const t = ts / 1000, raw = G.last ? t - G.last : 0, dt = Math.min(0.05, Math.max(0, raw)); G.last = t;
  try {
    update(dt);
    const ui = [G.screen, G.modal, G.popup, G.hover, G.fade.next]; if (!G._ui || ui.some((v, i) => v !== G._ui[i])) { G._ui = ui; G.dirty = true; }
    const fps = screenFps();
    if (G.dirty || G.fade.a > 0 || t - (G.drawnAt || 0) >= 1 / fps - 0.004) { const w0 = performance.now(); G.dirty = false; render(); Perf.sample(t - (G.drawnAt || t), (performance.now() - w0) / 1000, fps); G.drawnAt = t; } // rysowanie może poprosić o kolejną klatkę (G.dirty)
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
// Jakość grafiki = gęstość pikseli płótna. Wysoka: jak ekran (do 2), niska: pół piksela płótna na piksel ekranu (miękki obraz,
// ale 4 razy mniej pikseli do skopiowania w każdej klatce: na słabym laptopie bez karty graficznej to główny koszt).
// Automatyczna zaczyna jak wysoka i schodzi o stopień (2 → 1 → 0,75 → 0,5), gdy klatki przychodzą za późno.
const QUALITIES = [{ id: 'auto', name: 'Automatyczna' }, { id: 'high', name: 'Wysoka' }, { id: 'low', name: 'Niska' }];
function renderDpr() {
  const dev = Math.min(window.devicePixelRatio || 1, 2), q = G.settings.quality;
  if (q === 'high') return dev;
  if (q === 'low') return Math.min(dev, 1) * 0.5;
  return Math.min(dev, G.settings.autoDpr || dev);
}
// Jakość schodzi, gdy klatki przychodzą wyraźnie później, niż ekran chce (mediana spóźnienia > 12 ms), i to albo przy długim
// rysowaniu w skrypcie (> 12 ms), albo dwa razy z rzędu: kopiowanie pikseli na płótno (bez karty graficznej) nie wlicza się w czas
// skryptu, a pojedyncze przestoje z zewnątrz (karta w tle, zrzut ekranu, generowanie grafiki) nie obniżają jakości.
const Perf = {
  late: [], work: [], strikes: 0, fps: 0, ms: 0,
  sample(gap, work, fps) {
    if (gap > 0 && gap < 1) { this.fps = this.fps ? this.fps * 0.9 + 0.1 / gap : 1 / gap; this.ms = this.ms ? this.ms * 0.9 + work * 100 : work * 1000; }
    if (G.settings.quality !== 'auto' || fps < 12 || gap <= 0 || gap > 0.25 || (G.screens.adventure && G.screens.adventure.aiRun)) return;
    this.late.push(gap - 1 / fps); this.work.push(work); if (this.late.length < 60) return;
    const med = a => a.slice().sort((x, y) => x - y)[a.length >> 1], late = med(this.late) > 0.012, busy = med(this.work) > 0.012; this.late = []; this.work = [];
    this.strikes = late ? this.strikes + 1 : 0;
    if (late && (busy || this.strikes >= 2) && G.dpr > 0.5) { G.settings.autoDpr = G.dpr > 1 ? 1 : G.dpr > 0.75 ? 0.75 : 0.5; this.strikes = 0; saveSettings(); resize(); }
  },
};
// Licznik wydajności (klawisz F): klatki na sekundę, czas rysowania w skrypcie, rozmiar płótna i karta graficzna według przeglądarki
function gpuName() {
  if (G._gpu == null) {
    try { const gl = document.createElement('canvas').getContext('webgl'), ext = gl && gl.getExtension('WEBGL_debug_renderer_info'); G._gpu = gl ? String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER)) : 'brak WebGL'; }
    catch (e) { G._gpu = '?'; }
  }
  return G._gpu;
}
function drawPerfInfo(ctx) {
  const lines = [`${Perf.fps.toFixed(0)} kl/s (ekran chce ${screenFps()}), skrypt ${Perf.ms.toFixed(1)} ms`,
    `płótno ${G.canvas.width}×${G.canvas.height}, gęstość ${G.dpr}, jakość: ${(QUALITIES.find(q => q.id === G.settings.quality) || QUALITIES[0]).name}`, `grafika: ${gpuName().slice(0, 60)}`];
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(4, 4, 390, 58);
  lines.forEach((l, i) => text(ctx, l, 10, 20 + i * 17, { size: 12, weight: 600, color: '#ffe9a0' })); ctx.restore();
}
function showGfxSettings(back) {
  const S = G.settings, cur = (QUALITIES.find(q => q.id === S.quality) || QUALITIES[0]).name;
  const set = id => () => { S.quality = id; if (id === 'auto') delete S.autoDpr; saveSettings(); resize(); showGfxSettings(back); };
  showDialog(`Jakość grafiki: ${cur} (${Math.round(G.dpr * 100)}% ostrości). Na słabym komputerze wybierz Niską: obraz jest trochę mniej ostry, ale gra działa znacznie płynniej. Automatyczna sama obniża jakość, gdy klatek jest za mało. Klawisz F pokazuje licznik klatek.`,
    [...QUALITIES.map(q => ({ label: q.name, action: set(q.id) })), { label: 'OK', key: 'escape', action: () => { if (back) back(); } }], { bw: 130 });
}
function init() {
  loadSettings();
  G.canvas = document.getElementById('game'); G.ctx = G.canvas.getContext('2d', { alpha: false }); // nieprzezroczyste płótno: przeglądarka nie miesza go z tłem strony
  resize(); window.addEventListener('resize', resize); bindInput();
  SaveStore.init(); // ustala miejsce zapisów w tle (konto Claude albo przeglądarka)
  setScreen('menu'); G.fade.a = 1; G.fade.target = 0;
  requestAnimationFrame(frame);
}
init();
</script>
