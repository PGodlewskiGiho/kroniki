# Publikacja gry na GitHub Pages po każdej zmianie w main (tylko gdy testy przejdą).
# Jednorazowo: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
name: Publikacja (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # build.js wbudowuje bibliotekę PeerJS (gra online) z node_modules
      - run: npm ci --ignore-scripts
      # gra to jeden plik; na stronie ma być pod adresem głównym, więc kopiujemy go jako index.html
      - run: node build.js --check
      - run: mkdir _site && cp "Kroniki Królestw.html" _site/index.html && cp web/* _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
